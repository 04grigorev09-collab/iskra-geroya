<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--acc:#ffb347;--pink:#ff5d8f;--panel:#1d1838;--panel2:#2a2350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#0d0b1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.coin{display:inline-block;width:1.15em;height:1.15em;background:url(icons/coin.png) center/contain no-repeat;background-image:-webkit-image-set(url(icons/coin.png) 1x,url(icons/coin-256.png) 2x);background-image:image-set(url(icons/coin.png) 1x,url(icons/coin-256.png) 2x);vertical-align:-.22em;margin-right:.22em}
.spark{display:inline-block;width:1.15em;height:1.15em;background:url(icons/spark.png) center/contain no-repeat;background-image:-webkit-image-set(url(icons/spark.png) 1x,url(icons/spark-256.png) 2x);background-image:image-set(url(icons/spark.png) 1x,url(icons/spark-256.png) 2x);vertical-align:-.22em;margin-right:.2em}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 12px) calc(var(--sal) + 10px)}
#top{display:flex;align-items:center;gap:8px;margin-right:64px}
#lvl{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd28a,#ff7b39 70%,#b8430f);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;text-shadow:0 1px 2px #0008;box-shadow:0 2px 6px #0007,0 0 0 2px #fff3 inset;flex:none}
.bars{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.bar{position:relative;height:14px;border-radius:8px;background:#0009;overflow:hidden;box-shadow:0 0 0 1.5px #0006}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px}
.bar.hp i{background:linear-gradient(#7dff8f,#24b94a)}
.bar.hp.low i{background:linear-gradient(#ff8f8f,#d62b2b)}
.bar.xp{height:9px}.bar.xp i{background:linear-gradient(#9fd8ff,#3c8dff)}
.bar span{position:absolute;inset:0;font-size:12px;line-height:14px;text-align:center;font-weight:800;text-shadow:0 1px 1px #000}
#res,#zone,#quest,#daily{margin-right:110px}
#res{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;font-size:13px;font-weight:800}
.chip.bump{animation:bump .22s}@keyframes bump{50%{transform:scale(1.12)}}
.chip{display:inline-block;background:#000a;border-radius:12px;padding:4px 7px;box-shadow:0 0 0 1px #fff2 inset;white-space:nowrap}
.chip.full{background:#b3122eee;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#zone{margin-top:6px;font-size:12px;font-weight:700;opacity:.92;text-shadow:0 1px 2px #000}
#quest{margin-top:6px;background:linear-gradient(90deg,#000b,#0006);border-left:3px solid var(--acc);border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.3}
#quest b{color:var(--acc)}
#hud.boss #hint{bottom:calc(var(--sab) + 255px)}
.qrow{display:flex;align-items:center;gap:6px;margin-top:2px}.qrow #qRew{flex:1}
#qNum{opacity:.75;font-weight:800}
.qskip{pointer-events:auto;flex:none;min-width:30px;height:24px;padding:0 7px;border-radius:8px;background:#ffffff22;font-size:13px;font-weight:900;color:#fff}
.qskip:disabled{opacity:.45}
#quest .qb{height:4px;background:#fff2;border-radius:3px;margin-top:4px;overflow:hidden}
#quest .qb i{display:block;height:100%;background:var(--acc)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 200px);background:#000c;padding:8px 14px;border-radius:14px;font-size:14px;font-weight:700;max-width:86%;text-align:center;box-shadow:0 0 0 1.5px #ffb34788;transition:opacity .3s}
.hbtn{pointer-events:auto;touch-action:none;-webkit-user-select:none;position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;box-shadow:0 4px 10px #0008,0 0 0 2px #fff3 inset;text-shadow:0 1px 2px #0009;overflow:hidden}
.hbtn:active{transform:scale(.93)}
.hbtn .cd{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
.hbtn small{font-size:10px;opacity:.9;position:relative}
.hbtn span{position:relative;font-size:11px;letter-spacing:.2px}
.hbtn svg{position:relative;width:40%;height:40%;fill:currentColor;filter:drop-shadow(0 1px 1px #0008);margin-bottom:1px}
#bHome svg{width:36%;height:36%}#bHome .ib{display:none}#bHome.back .ib{display:block}#bHome.back .ih{display:none}
.hbtn img.ico{position:relative;width:48%;height:48%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 2px #0007);margin-bottom:1px}
#bUp img.ico{width:46%;height:46%}#bDash img.ico{width:46%;height:46%;filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 2px 3px #0008)}#bHome img.ico{width:50%;height:50%}#bAuto img.ico{width:40%;height:40%;margin-bottom:0}#bAuto span{font-size:10px;line-height:1}#bAuto small{font-size:9px;line-height:1.1}#bPause img.ico{width:100%;height:100%;filter:drop-shadow(0 1px 2px #0008);margin:0}#bPause{padding:0}
.row .ic img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 1px 2px #0008)}
#bDash span{font-size:13px}
#bPause{top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);width:42px;height:42px;background:#0009;font-size:15px;letter-spacing:1px}
#bDash{right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 22px);width:84px;height:84px;background:radial-gradient(circle at 35% 30%,#ff9ab8,#e2336b 70%);font-size:14px}
#bHome{right:calc(var(--sar) + 27px);bottom:calc(var(--sab) + 124px);width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#2e4256,#0e1823 75%);box-shadow:0 4px 10px #0008,0 0 0 2.5px #7cd3ffaa inset;font-size:12px}
#bHome.back{background:radial-gradient(circle at 35% 30%,#c8ffb0,#3fae3a 70%);box-shadow:0 4px 10px #0008,0 0 0 2px #fff3 inset}
#bBoss{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 124px);padding:12px 22px;border-radius:30px;background:linear-gradient(#ff7b8c,#d6264a);font-weight:900;font-size:15px;box-shadow:0 4px 0 #7d1028,0 0 10px #ff4d6d66;animation:bossp .8s infinite alternate}
@keyframes bossp{to{box-shadow:0 4px 0 #7d1028,0 0 26px #ff4d6dcc}}
#bUp.new.can::after{display:none}
#bUp.new::before{content:"!";position:absolute;top:4px;left:8px;min-width:18px;height:18px;border-radius:9px;background:#7cf3ff;color:#04263a;font-size:11px;line-height:18px}
.tabs button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff2e55;margin-left:4px;vertical-align:2px}
.row.glow{box-shadow:0 0 0 2px #7cf3ff inset;animation:glowp .8s infinite alternate}
@keyframes glowp{to{box-shadow:0 0 0 2px #7cf3ff inset,0 0 16px #7cf3ff99}}
#daily{margin-top:5px;font-size:12px;line-height:1.3;background:#0008;border-radius:8px;padding:4px 8px;border-left:3px solid #7cf3ff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#daily:empty{display:none}
.buffc{background:#3a2a7acc;color:#e4d4ff}
#bUp{left:calc(var(--sal) + 14px);bottom:calc(var(--sab) + 18px);width:78px;height:78px;background:radial-gradient(circle at 35% 30%,#ffe29a,#f08c00 70%);font-size:12px}
#bUp.can::after{content:"";position:absolute;top:7px;right:12px;width:12px;height:12px;border-radius:50%;background:#ff2e55;box-shadow:0 0 0 2px #fff}
#bAuto{left:calc(var(--sal) + 100px);bottom:calc(var(--sab) + 16px);width:58px;height:58px;background:radial-gradient(circle at 35% 30%,#3a2f52,#16101f 75%);box-shadow:0 4px 10px #0008,0 0 0 2.5px #b58cffaa inset;font-size:12px}
#bAuto.on{background:radial-gradient(circle at 35% 30%,#d6b3ff,#7b3fe4 70%)}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);background:#070512cc;z-index:10}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
@keyframes panIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.screen:not(.hidden){animation:scrIn .16s ease-out}
.screen:not(.hidden) .panel{animation:panIn .24s cubic-bezier(.2,.9,.25,1.18)}
#hud:not(.hidden){animation:scrIn .25s ease-out}
#start.out{opacity:0;transition:opacity .18s;pointer-events:none}
.panel{width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#262048,#1a1534);border-radius:22px;box-shadow:0 10px 40px #000a,0 0 0 2px #ffffff14 inset;padding:16px;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:.3px;margin-bottom:8px}
#bank{display:inline-block;min-width:3ch}
.phead .sp{flex:1}
.x{width:38px;height:38px;border-radius:12px;background:#ffffff14;font-size:22px;line-height:1}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;padding:9px 2px;border-radius:12px;background:#ffffff10;font-size:13px;font-weight:700}
.tabs button.on{background:var(--acc);color:#2a1600}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;flex:1;min-height:0;padding-right:2px}
.row{display:flex;align-items:center;gap:10px;background:#ffffff0c;border-radius:14px;padding:10px;margin-bottom:8px}
.row .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px}
.row .tx small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.row .tx .gr{color:#8dff9c;font-weight:700;opacity:1}
.buy{min-width:84px;padding:9px 8px;border-radius:12px;background:linear-gradient(#ffd166,#f39c12);color:#2a1600;font-weight:900;font-size:13px;box-shadow:0 3px 0 #a35f00}
.buy:disabled{background:#4a4470;color:#fff8;box-shadow:0 3px 0 #2c2850}
.buy.alt{background:linear-gradient(#a5f3ff,#2a8fc4);color:#04263a;box-shadow:0 3px 0 #145a80}
.buy.ok{background:#2f7a43;color:#d8ffe0;box-shadow:0 3px 0 #1b4a28}
.amt{display:flex;gap:6px;align-items:center;font-size:12px;margin:2px 0 8px}
.amt button{padding:5px 10px;border-radius:9px;background:#ffffff12;font-weight:800}
.amt button.on{background:#fff;color:#222}
.big{display:block;width:100%;padding:15px;border-radius:16px;font-size:18px;font-weight:900;background:linear-gradient(#ffd166,#f08c00);color:#2a1600;box-shadow:0 5px 0 #9a5500;margin-top:10px}
.big.sec{background:#ffffff14;color:#fff;box-shadow:0 5px 0 #0006}
.big.red{background:linear-gradient(#ff7b8c,#d6264a);color:#fff;box-shadow:0 5px 0 #7d1028}
#start{background:linear-gradient(#0b0818e6 0,#0b0818b3 22%,#0b081800 34%,#0b081800 54%,#0b0818b3 64%,#0b0818ee 100%),#0b0818 url(bg-start-1170x2532.jpg) center/cover no-repeat;flex-direction:column}
#start h1.logo{background:none;-webkit-background-clip:border-box;background-clip:border-box;filter:none;color:#ffd166;font-size:0;line-height:0}
#start h1.logo img{display:block;width:100%;max-width:330px;height:auto;margin:0 auto -4px;filter:drop-shadow(0 6px 14px #000a)}
#start h1.logo.txt{font-size:46px;line-height:1}
#startBox{display:flex;flex-direction:column;height:100%;max-height:820px}
#startGap{flex:1;min-height:120px}
#start h1{margin:0;font-size:46px;line-height:1;font-weight:900;text-align:center;letter-spacing:1px;background:linear-gradient(#fff3c4,#ffb347 50%,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1240) drop-shadow(0 0 20px #ff7a4855)}
#start .sub{text-align:center;opacity:.85;margin:6px 0 16px;font-weight:700;letter-spacing:2px;font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.badges span{font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;background:#ffffff14;box-shadow:0 0 0 1px #ffffff22 inset}
.badges span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#6dff8b;margin-right:6px;vertical-align:1px}
#startBox{width:100%;max-width:360px}
#startInfo{background:#ffffff0f;border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.5;margin-bottom:4px;box-shadow:0 0 0 1px #ffffff1a inset}
#startInfo:empty{display:none}
#startInfo b{color:var(--acc)}
.vol{display:flex;align-items:center;gap:10px;padding:8px 4px;font-weight:800;font-size:14px}.vol span{width:86px;font-size:13px;line-height:1.15}.vol input{flex:1;accent-color:#ffb347;height:28px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#ffffff0c;border-radius:14px;margin-bottom:7px;font-size:14px;font-weight:700}
.tog small{display:block;font-weight:500;opacity:.7;font-size:11px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:#4a4470;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#34c759}.sw.on::after{left:23px}
#toasts{position:absolute;top:34%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.toast{background:#000d;padding:8px 14px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 0 0 1.5px var(--acc);animation:tin .25s ease-out;max-width:90%;text-align:center}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}}
.stat{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #ffffff12;font-size:14px}
.stat b{color:var(--acc)}
textarea{width:100%;height:110px;border-radius:12px;background:#0006;color:#fff;border:1px solid #fff3;padding:8px;font-size:11px;-webkit-user-select:text;user-select:text;touch-action:auto}
p{line-height:1.45;font-size:14px;margin:6px 0}
.res-title{font-size:30px;font-weight:900;text-align:center;margin:4px 0 8px}
.win{color:#ffd166}.lose{color:#ff7b8c}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="top">
    <div id="lvl">1</div>
    <div class="bars">
      <div class="bar hp" id="hpbar"><i id="hpfill"></i><span id="hptxt"></span></div>
      <div class="bar xp"><i id="xpfill"></i></div>
    </div>
  </div>
  <div id="res"><span class="chip" id="bankchip"><span class="coin"></span><b id="bank">0</b></span><span class="chip" id="bagchip">Рюкзак <b id="bag">0/20</b></span><span class="chip">Сила <b id="pow">0</b></span><span id="buffs"></span></div>
  <div id="zone"></div>
  <div id="quest"><div class="qline"><b id="qHead"></b> <span id="qTxt"></span> <span id="qNum"></span></div><div class="qline qrow"><span id="qRew"></span><button id="qSkip" class="qskip" aria-label="Другое задание">↻</button></div><div class="qb"><i id="qFill"></i></div></div>
  <div id="daily"></div>
  <div id="hint" class="hidden"></div>
  <button class="hbtn" id="bPause" aria-label="Пауза"><img class="ico" src="icons/pause.png" srcset="icons/pause.png 1x, icons/pause-256.png 2x" alt="" aria-hidden="true" draggable="false"></button>
  <button class="hbtn" id="bUp"><img class="ico" src="icons/upgrade.png" srcset="icons/upgrade.png 1x, icons/upgrade-256.png 2x" alt="" aria-hidden="true" draggable="false"><span>Прокачка</span></button>
  <button class="hbtn" id="bAuto"><img class="ico" src="icons/auto.png" srcset="icons/auto.png 1x, icons/auto-256.png 2x" alt="" aria-hidden="true" draggable="false"><span>АВТО</span><small id="autoTxt">выкл</small></button>
  <button class="hbtn" id="bDash"><div class="cd" id="dashCd"></div><img class="ico" src="icons/dash.png" srcset="icons/dash.png 1x, icons/dash-256.png 2x" alt="" aria-hidden="true" draggable="false"><span>Рывок</span></button>
  <button class="hbtn" id="bHome"><div class="cd" id="homeCd"></div><img class="ico ih" src="icons/home.png" srcset="icons/home.png 1x, icons/home-256.png 2x" alt="" aria-hidden="true" draggable="false"><img class="ico ib" src="icons/back.png" srcset="icons/back.png 1x, icons/back-256.png 2x" alt="" aria-hidden="true" draggable="false"><span id="homeLbl">Домой</span><small id="backTxt"></small></button>
  <button id="bBoss" class="hidden">Вызвать босса</button>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<div id="start" class="screen">
  <div id="startBox">
    <div id="startTop"><h1 class="logo" aria-label="Искра Героя"><img src="logo-1200x500.png" alt="Искра Героя" width="1200" height="500" decoding="async" onerror="this.parentNode.classList.add('txt');this.parentNode.textContent='ИСКРА ГЕРОЯ'"></h1>
    <div class="sub">ОХОТА ЗА ОПЫТОМ</div>
    <div class="badges"><span>Без рекламы</span><span>Без доната</span><span>Офлайн</span><span>Автосохранение</span></div></div>
    <div id="startGap"></div>
    <div id="startInfo"></div>
    <button class="big" id="bPlay">Играть</button>
    <button class="big sec" id="bHow">Как играть</button>
    <button class="big sec" id="bSet0">Настройки</button>
  </div>
</div>

const SAVE_KEY='iskra_geroya_save_v1';
function newSave(){return{v:1,bank:0,bag:{n:0,v:0},lvl:1,xp:0,
 up:{atk:0,hp:0,aspd:0,spd:0,bag:0,regen:0,crit:0,mag:0},
 tal:{might:0,vital:0,greed:0,wisdom:0,portal:0},sparks:0,

 slots:['sword',null],quest:null,qn:0,
 stats:{kills:0,coins:0,bosses:0,deaths:0,play:0,elites:0,goblins:0},
 set:{mvol:.7,svol:.8,music:true,sfx:true,vib:true,eco:false,nums:true,adapt:true,auto:false,autoBoss:false,calm:false},buff:{gold:0,dmg:0,xp:0},daily:null,slot2New:false,lastQ:null,qSkipT:0,streak:{last:'',n:0},ecoAuto:false,pickShown:false,calmAsked:false,tutDash:false,
 last:Date.now(),tut:0,started:false}}
function merge(d,o){for(const k in o){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))merge(d[k],o[k]);else d[k]=o[k]}return d}
// защита от битых/чужих сохранений: числа — конечные, объекты — объекты, массивы — массивы, оружие — существующее
function sanitize(x,def){for(const k in def){const d=def[k];
 if(d&&typeof d==='object'&&!Array.isArray(d)){x[k]=(x[k]&&typeof x[k]==='object'&&!Array.isArray(x[k]))?x[k]:{};sanitize(x[k],d)}
 else if(typeof d==='number'){const r=x[k],v=typeof r==='number'?r:(typeof r==='string'&&r.trim()!==''?+r:NaN);x[k]=Number.isFinite(v)?v:d}
 else if(typeof d==='boolean'){if(typeof x[k]!=='boolean')x[k]=d}
 else if(Array.isArray(d)){if(!Array.isArray(x[k]))x[k]=d.slice()}
 else if(x[k]===undefined)x[k]=d}return x}
function fixSave(o){sanitize(o,newSave());const WK=['sword','blaster','orbit','lightning']; // WEAP ещё не объявлен при load()
 o.slots=[0,1].map(i=>WK.includes(o.slots[i])?o.slots[i]:null);if(!o.slots[0])o.slots[0]=o.slots[1]||'sword';if(o.slots[1]===o.slots[0])o.slots[1]=null;
 o.lvl=Math.max(1,Math.floor(o.lvl));o.maxCh=Math.max(1,Math.floor(o.maxCh));o.ch=Math.min(o.maxCh,Math.max(1,Math.floor(o.ch)));o.unlocked=Math.min(4,Math.max(1,Math.floor(o.unlocked)));o.maxCh=Math.min(99,o.maxCh);o.ch=Math.min(o.ch,o.maxCh);o.bank=Math.max(0,o.bank);o.sparks=Math.max(0,o.sparks);o.bossFails=Math.min(50,Math.max(0,o.bossFails));o.streak.n=Math.max(0,o.streak.n);o.set.mvol=Math.min(1,Math.max(0,o.set.mvol));o.set.svol=Math.min(1,Math.max(0,o.set.svol));
 for(const k in o.up)o.up[k]=Math.max(0,Math.floor(o.up[k]));for(const k in o.tal)o.tal[k]=Math.max(0,Math.floor(o.tal[k]));if(o.quest&&typeof o.quest!=='object')o.quest=null;if(o.daily&&typeof o.daily!=='object')o.daily=null;return o}

/* ---------- ЗВУК (WebAudio, всё синтезируется) ---------- */
const AU={c:null,m:null,sfx:null,duck:null,mf:null,b:[null,null],nb:null,last:{},needResume:false};
// Граф: [тоны/шумы SFX] → sfx ─┐
//        [музыка] → b0/b1 (кроссфейд тем) → duck (приглушение под громкие SFX) → lowpass ─┤→ master → лимитер → выход
function initAudio(){
 try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(e){} // не глушит музыку/подкасты на iOS 16.4+
 if(AU.c){if(AU.c.state!=='running'&&!document.hidden)AU.c.resume().catch(()=>{});return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{AU.c=new AC()}catch(e){return}
 const c=AU.c;
 const lim=c.createDynamicsCompressor();lim.threshold.value=-10;lim.knee.value=6;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.2;lim.connect(c.destination);AU.lim=lim;
 AU.m=c.createGain();AU.m.gain.value=.9;AU.m.connect(lim);
 AU.sfx=c.createGain();AU.sfx.connect(AU.m);
 // эхо: одна задержка с обратной связью и затуханием ВЧ; посылы с музыки (после дакинга) и немного с SFX
 AU.dly=c.createDelay(1);AU.dly.delayTime.value=.11;const fb=c.createGain();fb.gain.value=.34;const dmp=c.createBiquadFilter();dmp.type='lowpass';dmp.frequency.value=2600;
 AU.dly.connect(dmp);dmp.connect(fb);fb.connect(AU.dly);const fx=c.createGain();fx.gain.value=1;AU.dly.connect(fx);fx.connect(AU.m);
 AU.sM=c.createGain();AU.sM.gain.value=.2;AU.sM.connect(AU.dly);AU.sS=c.createGain();AU.sS.gain.value=.08;AU.sS.connect(AU.dly);AU.sfx.connect(AU.sS);
 // 3 стерео-шины (лево/центр/право) — панорама по X источника без нод на каждый звук
 AU.pan=null;if(c.createStereoPanner){AU.pan=[-.5,0,.5].map(v=>{const p=c.createStereoPanner();p.pan.value=v;p.connect(AU.sfx);return p})}
 AU.mf=c.createBiquadFilter();AU.mf.type='lowpass';AU.mf.frequency.value=4200;AU.mf.Q.value=.5;AU.mf.connect(AU.m);
 AU.mv=c.createGain();AU.mv.connect(AU.mf);AU.mv.connect(AU.sM);AU.duck=c.createGain();AU.duck.connect(AU.mv);
 for(let i=0;i<2;i++){AU.b[i]=c.createGain();AU.b[i].gain.value=0;AU.b[i].connect(AU.duck)}
 applyVol();
 const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b;
 // iOS: после звонка/Siri контекст «interrupted» — помечаем и возобновляем при ближайшем касании
 c.addEventListener('statechange',()=>{AU.needResume=c.state!=='running'&&c.state!=='closed';if(c.state==='running')MU.next=0});
 try{navigator.audioSession&&navigator.audioSession.addEventListener('statechange',()=>{if(navigator.audioSession.state!=='active')AU.needResume=true})}catch(e){}
 setInterval(musicTick,80);
}
// плавно (без «зиппера»), и не срывая идущий кроссфейд тем
function applyVol(){if(!AU.c)return;const t=AU.c.currentTime;AU.sfx.gain.setTargetAtTime(1*S.set.svol,t,.03);AU.mv.gain.setTargetAtTime(S.set.mvol,t,.03)} // громкость музыки — отдельный узел, кроссфейд шин не трогаем
document.addEventListener('pointerdown',()=>{if(AU.c&&(AU.needResume||AU.c.state!=='running')&&!document.hidden&&(S.set.music||S.set.sfx))AU.c.resume().then(()=>{AU.needResume=false}).catch(()=>{})},true);
// мягкая атака (без щелчков) и экспоненциальный спад
function tone(f,dur,type='sine',vol=.3,slide=0,when=0,dest){
 const c=AU.c;if(!c)return;const t=c.currentTime+when,a=Math.min(.01,dur*.3);const o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,a+.02));
 o.connect(g);g.connect(dest||AU.cur||AU.sfx);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol,freq,ft='bandpass',when=0,dest,q=.8){
 const c=AU.c;if(!c)return;const t=c.currentTime+when;const s=c.createBufferSource();s.buffer=AU.nb;s.playbackRate.value=.8+Math.random()*.4;
 const f=c.createBiquadFilter();f.type=ft;f.frequency.value=freq;f.Q.value=q;const g=c.createGain();
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||AU.cur||AU.sfx);s.start(t,Math.random()*.3);s.stop(t+dur+.02)}
// музыкальная нота с медленной атакой/релизом (пэды) — линейные огибающие
function mnote(f,dur,type,vol,when,dest,att=.01,det=0){
 const c=AU.c,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
 if(det){const o2=c.createOscillator();o2.type=type;o2.frequency.value=f;o2.detune.value=det;o.detune.value=-det;o2.connect(g);o2.start(t);o2.stop(t+dur+.02)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur*.6));g.gain.linearRampToValueAtTime(0,t+dur);
 o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
// FM-лид: модулятор с быстро гаснущим индексом — «звонкий колокольчик»
function fmnote(f,ratio,idx,dur,vol,when,dest){const c=AU.c,t=c.currentTime+when,mo=c.createOscillator(),mg=c.createGain(),ca=c.createOscillator(),cg=c.createGain();
 mo.frequency.value=f*ratio;mg.gain.setValueAtTime(f*idx,t);mg.gain.exponentialRampToValueAtTime(f*idx*.05,t+Math.min(dur,.25));mo.connect(mg);mg.connect(ca.frequency);ca.frequency.value=f;
 cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(vol,t+.008);cg.gain.exponentialRampToValueAtTime(.0001,t+dur);ca.connect(cg);cg.connect(dest);mo.start(t);ca.start(t);mo.stop(t+dur+.02);ca.stop(t+dur+.02)}
// бас с фильтр-огибающей (для пилы/квадрата): «ква» вместо плоского жужжания
function blip(f,dur,vol,when,dest,type){const c=AU.c,t=c.currentTime+when,o=c.createOscillator(),q=c.createBiquadFilter(),g=c.createGain();o.type=type;o.frequency.value=f;q.type='lowpass';q.Q.value=6;
 q.frequency.setValueAtTime(Math.min(5000,f*8),t);q.frequency.exponentialRampToValueAtTime(Math.max(150,f*1.2),t+dur*.7);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(q);q.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)}

// лимит голосов: в окне 60 мс частым звукам отказываем раньше, важные проходят всегда

 {const muf=mode!=='play'&&mode!=='menu',ft=muf?650:eco?3000:2400+3600*MU.si;if(Math.abs(ft-MU.fT)>150){MU.fT=ft;AU.mf.frequency.setTargetAtTime(ft,c.currentTime,muf?.15:.4)}}

 e.hp-=d;e.flash=.09;if(e.type!=='boss'&&e.type!=='guard'){const n=norm(e.x-fx,e.y-fy);e.kx+=n.x*180;e.ky+=n.y*180}
 // обычные попадания по одному врагу копятся в одну цифру (меньше шума при АВТО); крит — отдельный крупный всплеск
 if(crit)floatTxt(e.x,e.y-e.r-10,fmt(d)+'!','#ffd166',19);else{if(time-(e.dl||-9)>.5){e.dacc=0;e.dn=0}e.dacc+=d;e.dn++;e.dl=time;const f=e.fl;if(f&&f.life>.05){f.txt=fmt(e.dacc);f.life=.9;f.x=e.x;f.y=e.y-e.r-4;f.size=Math.min(18,13+Math.log2(e.dn));f.pop=.12}else e.fl=floatTxt(e.x,e.y-e.r-4,fmt(e.dacc),'#fff',Math.min(18,13+Math.log2(e.dn)))}sfx(crit?'crit':'hit',e.x);
 if(e.hp<=0){if(crit){FX.stop=Math.max(FX.stop,.05);FX.flash=Math.max(FX.flash,.12)}if(e.type==='boss')FX.stop=.12;killEnemy(e)}}
function killEnemy(e){if(e.dead)return;e.dead=true;if(e.type!=='boss'&&ghosts.length<24)ghosts.push(Object.assign({},e,{die:.18,flash:.18,hp:e.max,shield:0,state:0}));if(e.elite||e.type==='guard')rings.push({x:e.x,y:e.y,r0:e.r,r1:e.r+70,life:.35,max:.35,col:'#ffffff'});const d=ET[e.type];burst(e.x,e.y,e.col,e.type==='boss'?60:14,e.type==='boss'?320:180,e.type==='boss'?7:4);killSfx(e);
 S.stats.kills++;chKills++;if(BF.active)BF.kills++;
 gainXp(xpVal(e.t)*(e.elite?3:1)*(e.type==='guard'?8:1)*(e.type==='boss'?30:1)*(e.type==='goblin'?4:1));
 let n=Math.max(1,Math.round(d.loot*rand(.8,1.6)));let v=lootVal(e.t)*ST.gold*(S.buff.gold>0?2:1);
 if(e.elite){n*=3;S.stats.elites++;questEv('elite')}
 if(e.type==='goblin'){n=14;v*=3;S.stats.goblins++;questEv('goblin');toast('Воришка пойман! Куча золота!');sfx('gold')}
 if(e.type==='boss'){onBossKill(e);n=0}
 if(e.type==='guard')onGuardKill(e);
 if(d.split){for(let i=0;i<2;i++)makeEnemy('mini',e.x+rand(-12,12),e.y+rand(-12,12),e.ring)}
 for(let i=0;i<n;i++){const a=rand(TAU),s=rand(60,200);if(loot.length>160)loot.shift();loot.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,v,life:45,big:e.type==='goblin'||!!e.elite})}
 questEv('kill',e.ring);
 if(S.tut===0){S.tut=1;hint('Монеты попадают в рюкзак. Собери побольше!')}}

 P.hp-=d;P.inv=BF.active?.5:.35;P.hurtT=.25;P.calmT=3;cam.shake=Math.min(12,cam.shake+5);sfx('hurt');vib(25);questEv('hurt');floatTxt(P.x,P.y-24,'-'+fmt(d),'#ff6b6b',14,true);

  for(const k in WEAP)if(WEAP[k].lvl===S.lvl)toast('Новое оружие: '+WEAP[k].name+'! Экипируй в «Прокачке»',3500);
  if(S.lvl===SLOT2_LVL&&!S.slots[1]){S.slot2New=true;setTimeout(openSlotPick,500)}}
 if(up){recalc();P.hp=Math.min(ST.hp,Math.max(0,P.hp)+ST.hp*.5);sfx('level');vib(40);burst(P.x,P.y,'#ffd166',30,220,5);rings.push({x:P.x,y:P.y,r0:14,r1:150,life:.5,max:.5,col:'#ffd166'},{x:P.x,y:P.y,r0:8,r1:95,life:.4,max:.4,col:'#fff6c2'});FX.flash=Math.max(FX.flash,.12);FX.stop=Math.max(FX.stop,.05);floatTxt(P.x,P.y-36,'УРОВЕНЬ '+S.lvl,'#ffd166',22,true);save()}}

 modal(h+'<button class="big sec" data-close="play">Позже</button>')}
function nearest(x,y,range,excl){let b=null,bd=range*range;for(const e of enemies){if(e.dead||excl&&excl.has(e))continue;const dx=e.x-x,dy=e.y-y,dd=dx*dx+dy*dy-e.r*e.r;if(dd<bd){bd=dd;b=e}}return b}
function updWeapons(dt){
 for(const w of S.slots){if(!w)continue;const W_=WEAP[w];P.wcd[w]=(P.wcd[w]||0)-dt*ST.aspd;const dmg=ST.dmg*W_.mul;
  if(w==='orbit'){for(let i=0;i<3;i++){const a=time*4.2+i*TAU/3;const bx=P.x+Math.cos(a)*68,by=P.y+Math.sin(a)*68;
    for(const e of enemies){if(e.dead||e.ocd>0)continue;const dx=e.x-bx,dy=e.y-by;if(dx*dx+dy*dy<(e.r+13)**2){e.ocd=W_.cd/ST.aspd;hitEnemy(e,dmg,P.x,P.y)}}}continue}
  if(P.wcd[w]>0)continue;const t=nearest(P.x,P.y,W_.range);if(!t)continue;P.wcd[w]=W_.cd;
  const a=Math.atan2(t.y-P.y,t.x-P.x);P.face=a;
  if(w==='sword'){P.swing={a,t:.2};sfx('swing');for(const e of enemies){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,d=hyp(dx,dy);if(d>W_.range+e.r)continue;let da=Math.abs(((Math.atan2(dy,dx)-a)+Math.PI*3)%TAU-Math.PI);if(da<1.15||d<e.r+P.r+6){hitEnemy(e,dmg,P.x,P.y);if(parts.length<300)parts.push({x:e.x-dx/d*e.r*.8,y:e.y-dy/d*e.r*.8,vx:dx/d*90,vy:dy/d*90,life:.12,max:.12,r:3.5,col:'#ffffff'})}}}
  else if(w==='blaster'){sfx('shoot');parts.push({x:P.x+Math.cos(a)*18,y:P.y+Math.sin(a)*18,vx:Math.cos(a)*60,vy:Math.sin(a)*60,life:.09,max:.09,r:7,col:'#e6ffff'});shots.push({x:P.x+Math.cos(a)*16,y:P.y+Math.sin(a)*16,vx:Math.cos(a)*720,vy:Math.sin(a)*720,dmg,life:.5})}
  else if(w==='lightning'){sfx('zap');const hit=new Set();let cur={x:P.x,y:P.y},tg=t;const pts=[{x:P.x,y:P.y}];
   for(let i=0;i<4&&tg;i++){hit.add(tg);pts.push({x:tg.x,y:tg.y});hitEnemy(tg,dmg*(1-i*.12),cur.x,cur.y);cur=tg;tg=nearest(cur.x,cur.y,170,hit)}
   const path=[pts[0]];for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1];for(let k=1;k<=4;k++){const t=k/4;path.push({x:p.x+(q.x-p.x)*t+(k<4?rand(-8,8):0),y:p.y+(q.y-p.y)*t+(k<4?rand(-8,8):0)})}}
   bolts.push({path,life:.18})}}}

function goHome(){if(P.homeCd>0||P.dead||inBase())return;if(BF.active)endBoss(false,true);burst(P.x,P.y,'#7cf3ff',24,200);P.back={x:P.x,y:P.y,ch:S.ch};P.backT=45;P.x=0;P.y=60;cam.x=P.x;cam.y=P.y;P.homeCd=ST.homeCd;sfx('tele');burst(P.x,P.y,'#7cf3ff',24,200);
 if(S.tut<3)hint('Добыча сдаётся автоматически на базе. Здесь же герой лечится.')}
const canBack=()=>!!(P.back&&P.backT>0&&inBase()&&P.back.ch===S.ch);
const nearAltar=()=>mode==='play'&&!P.dead&&accessible()>=4&&!BF.active&&BF.cool<=0&&hyp(P.x-ALTAR.x,P.y-ALTAR.y)<120;
function openBossConfirm(){if(!nearAltar())return;mode='paused';sfx('warn');const pw=power(),need=bossRec(S.ch),ok=pw>=need,mid=pw>=need*.75;
 const ad=S.set.adapt&&S.ch===S.maxCh&&S.bossFails>0?'<p>Поддержка: босс ослаблен на <b>'+Math.round(Math.min(.3,.06*S.bossFails)*100)+'%</b> (адаптивная сложность).</p>':'';
 modal('<div class="res-title" style="color:#ff7b8c">'+BOSSNAMES[(S.ch-1)%BOSSNAMES.length]+'</div><div class="chip" style="display:block;text-align:center;font-size:16px;padding:10px">Твоя сила <b style="color:'+(ok?'#8dff9c':mid?'#ffd166':'#ff7b8c')+'">'+fmt(pw)+'</b> · нужна <b>'+fmt(need)+'</b></div><p>'+(ok?'Ты готов. Следи за красными зонами и жми Рывок.':mid?'Будет тяжело, но реально — уворачивайся от атак.':'Пока рано: прокачай Урон и Здоровье или подбери оружие.')+'</p>'+ad+'<p style="opacity:.7;font-size:12px">Сбежать можно в любой момент кнопкой «Домой» — без штрафа.</p><button class="big red" data-boss="go">В бой!</button><button class="big sec" data-close="play">Позже</button>')}
function goBack(){if(!P.back||P.backT<=0||P.back.ch!==S.ch)return;P.x=P.back.x;P.y=P.back.y;cam.x=P.x;cam.y=P.y;P.back=null;P.backT=0;sfx('tele');burst(P.x,P.y,'#6dff8b',24,200)}
function dash(){if(P.dashCd>0||P.dead||mode!=='play')return false;const m=moveVec();const d=(m.x||m.y)?norm(m.x,m.y):{x:Math.cos(P.face),y:Math.sin(P.face)};P.dashDir=d;P.dashT=.17;P.dashCd=2.2;P.inv=Math.max(P.inv,.32);sfx('dash');return true}

function startBoss(){if(BF.active||BF.cool>0)return;BF.active=true;sfx('bossStart');BF.t=0;BF.kills=0;for(const e of enemies)if(hyp(e.x-ALTAR.x,e.y-ALTAR.y)<ARENA_R+200&&e.type!=='guard')e.dead=true;
 BF.boss=makeEnemy('boss',ALTAR.x,ALTAR.y-150,4,{tb:.5});sfx('warn');vib(60);cam.shake=14;
 toast(BF.boss.name+' пробуждается!',2500);if(S.bossFails>0&&S.set.adapt&&S.ch===S.maxCh)toast('Поддержка: босс ослаблен на '+Math.round(Math.min(.3,.06*S.bossFails)*100)+'%',3000)}

 const sp=first?2+Math.ceil(S.ch/2):1;S.sparks+=sp;const fightT=BF.t;const ch=S.ch;endBoss(true);P.inv=3;eshots=[];warns=[];timers=[];BF.winT=1.3;/* до экрана победы герой неуязвим */S.bossFails=0;sfx('win');if(first)setTimeout(()=>sfx('chapter'),900);vib(80);cam.shake=18;
 if(first){S.maxCh++;S.unlocked=1}save();

function bossAI(e,dt,dx,dy,d){const ph=e.hp<e.max*.5?2:1;e.cd-=dt;
 if(e.state===1){e.st-=dt;if(e.st<=0){e.state=2;e.st=.6}return}
 if(e.state===2){e.st-=dt;e.vx=e.dir.x*620;e.vy=e.dir.y*620;if(e.st<=0){e.state=0;e.vx=e.vy=0}return}
 const n=norm(dx,dy);const sp=e.spd*(ph===2?1.25:1);if(d>170){e.vx=n.x*sp;e.vy=n.y*sp}else{e.vx=-n.y*sp*.6;e.vy=n.x*sp*.6}
 if(e.cd>0)return;e.pat=(e.pat+1)%4;e.cd=ph===2?1.7:2.4;sfx(['telC','telR','telL','telS'][e.pat]);
 if(e.pat===0){warnCircle(P.x,P.y,95,1,e.dmg,1);for(let i=0;i<(ph===2?3:2);i++)warnCircle(P.x+rand(-170,170),P.y+rand(-170,170),95,1.1,e.dmg,1)}
 else if(e.pat===1){const k=ph===2?22:15,o=rand(TAU);const fire=off=>{if(e.dead)return;for(let i=0;i<k;i++){const a=o+off+i*TAU/k;eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,dmg:e.dmg*.6,life:3,r:8,boss:1})}sfx('shoot')};
  warnCircle(e.x,e.y,e.r+20,.5,0,1);timers.push({t:.5,fn:()=>fire(0)});if(ph===2)timers.push({t:.9,fn:()=>fire(TAU/k/2)})}
 else if(e.pat===2){e.state=1;e.st=.85;e.dir=n;e.vx=e.vy=0;warnLine(e.x,e.y,n.x,n.y,620*.6+e.r,e.r*1.6,.85)}
 else{for(let i=0;i<3;i++){const a=rand(TAU);makeEnemy(Math.random()<.5?'slime':'bat',e.x+Math.cos(a)*90,e.y+Math.sin(a)*90,4)}warnCircle(e.x,e.y,160,1.1,e.dmg*.8,1)}}
function guardAI(e,dt,dx,dy,d){if(!e.home)e.home={x:e.x,y:e.y};const hd=hyp(e.x-e.home.x,e.y-e.home.y);if(e.aggro&&(hd>340||P.dead||inBase())&&e.state===0){e.aggro=false}if(!e.aggro){if(d<260&&hd<340&&!inBase())e.aggro=true;else{if(hd>8){const h=norm(e.home.x-e.x,e.home.y-e.y);e.vx=h.x*e.spd*1.3;e.vy=h.y*e.spd*1.3;e.hp=Math.min(e.max,e.hp+e.max*.1*dt)}else{e.vx=e.vy=0}return}}
 if(e.state===1){e.st-=dt;e.vx=e.vy=0;if(e.st<=0){e.state=2;e.st=.55}return}
 if(e.state===2){e.st-=dt;e.vx=e.dir.x*540;e.vy=e.dir.y*540;if(e.st<=0)e.state=0;return}
 const n=norm(dx,dy);e.vx=n.x*e.spd;e.vy=n.y*e.spd;e.cd-=dt;if(e.cd>0)return;e.cd=2.6;
 if(Math.random()<.5&&d<200){sfx('warn',e.x);warnCircle(e.x,e.y,125,.95,e.dmg,0);e.vx=e.vy=0;e.state=1;e.st=.95;e.dir={x:0,y:0}}
 else{e.state=1;e.st=.75;e.dir=n;sfx('warn',e.x);warnLine(e.x,e.y,n.x,n.y,540*.55+e.r,e.r*1.7,.75)}}

/* ---------- ОБНОВЛЕНИЕ ---------- */
function moveVec(){let x=0,y=0;if(keys.KeyA||keys.ArrowLeft)x--;if(keys.KeyD||keys.ArrowRight)x++;if(keys.KeyW||keys.ArrowUp)y--;if(keys.KeyS||keys.ArrowDown)y++;
 if(joy.id!==null){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=hyp(dx,dy);if(l>6){const m=Math.min(1,l/55);x=dx/l*m;y=dy/l*m}}
 const l=hyp(x,y);if(l>1){x/=l;y/=l}return{x,y}}
function weaponReach(){let r=999;for(const w of S.slots)if(w)r=Math.min(r,WEAP[w].range);return r}
function autoDir(){const hpF=P.hp/ST.hp,ib=inBase();
 for(const w of warns)if(w.kind==='c'&&w.dmg>0){const dx=P.x-w.x,dy=P.y-w.y;if(hyp(dx,dy)<w.r+P.r+8)return norm(dx||1,dy)}
 if(BF.active&&BF.boss){const b=BF.boss,dx=P.x-b.x,dy=P.y-b.y,d=hyp(dx,dy)||1;const want=weaponReach()<120?b.r+60:240;const k=clamp((d-want)/80,-1.5,1.5);return norm(-dy/d-dx/d*k,dx/d-dy/d*k)}
 if(S.set.autoBoss&&accessible()>=4&&!BF.active&&BF.cool<=0&&hpF>.9&&S.bag.n<ST.cap*.8&&power()>=bossRec(S.ch))return norm(ALTAR.x-P.x,ALTAR.y-P.y);
 if(hpF<.35||S.bag.n>=ST.cap){if(!ib){if(P.homeCd<=0){goHome();return{x:0,y:0}}return norm(-P.x,-P.y)}}
 if(ib){if(hpF<.92)return norm(-P.x,-P.y+40);if(P.back&&P.backT>0){goBack();return{x:0,y:0}}}
 if(S.bag.n<ST.cap){let b=null,bd=230*230;for(const l of loot){const dd=dist2(l,P);if(dd<bd){bd=dd;b=l}}if(b)return norm(b.x-P.x,b.y-P.y)}
 const acc=accessible();let ring=1;const pw=power();for(let r=1;r<=acc;r++)if(recPower(tier(S.ch,r))<=pw*1.05)ring=r;
 let b=null,bd=1e18;for(const e of enemies){if(e.dead||e.type==='guard'||e.type==='boss')continue;if(e.ring>ring&&e.type!=='goblin')continue;if(acc>=4&&hyp(e.x-ALTAR.x,e.y-ALTAR.y)<260)continue;const dd=dist2(e,P);if(dd<bd){bd=dd;b=e}}
 const ga=enemies.find(e=>e.type==='guard'&&e.aggro);if(ga&&recPower(tier(S.ch,ga.ring))*1.6>pw&&dist2(ga,P)<300*300)return norm(P.x-ga.x,P.y-ga.y);
 if(b){const d=Math.sqrt(bd);if(d<weaponReach()*.55)return{x:0,y:0};return norm(b.x-P.x,b.y-P.y)}
 const mid=(RING[ring]+RING[ring+1])/2,a=Math.atan2(P.y,P.x)+.5;return norm(Math.cos(a)*mid-P.x,Math.sin(a)*mid-P.y)}
function update(dt){time+=dt;S.stats.play+=dt;BF.cool-=dt;if(BF.active)BF.t+=dt;
 for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f()}}
 const acc=accessible();
 // игрок
 if(!P.dead){let m=moveVec();if(S.set.auto&&!m.x&&!m.y)m=autoDir();
  P.dashCd-=dt;P.inv-=dt;if(BF.winT>0)BF.winT-=dt;P.homeCd-=dt;P.hurtT-=dt;if(P.backT>0){if(inBase())P.backT-=dt;if(P.backT<=0)P.back=null}
  let vx=m.x*ST.speed,vy=m.y*ST.speed;if(P.dashT>0){P.dashT-=dt;vx=P.dashDir.x*ST.speed*3.3;vy=P.dashDir.y*ST.speed*3.3;if(Math.random()<.7)parts.push({x:P.x,y:P.y,vx:0,vy:0,life:.25,max:.3,r:9,col:'#ff9ab8'})}
  P.moving=(m.x||m.y)?1:0;if(P.moving&&!P.swing)P.face=Math.atan2(m.y,m.x);P.anim+=dt*P.moving;
  P.x+=vx*dt;P.y+=vy*dt;

 el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();st={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}});

let lastT=performance.now();
// авто-качество: если 2 окна по 2 с подряд средний кадр >22 мс — включаем эко-режим (один раз; игрок может выключить)
const PERF={acc:0,n:0,bad:0};
function autoQuality(el){PERF.acc+=Math.min(el,.05);PERF.n++;if(PERF.acc<2)return;const avg=PERF.acc/PERF.n;PERF.bad=avg>.022?PERF.bad+1:0;PERF.acc=0;PERF.n=0;
 if(PERF.bad>=3&&!S.set.eco&&!S.ecoAuto&&!BF.active){S.set.eco=true;S.ecoAuto=true;resize();toast('Включён эко-режим для плавности — можно выключить в настройках',3500);save()}}
function frame(now){requestAnimationFrame(frame);const el=(now-lastT)/1000;
 if(mode!=='play'&&mode!=='menu'){ // пауза/магазин/итоги: рисуем один замороженный кадр и не грузим GPU
  if(needFrame||lastMode!==mode){lastMode=mode;needFrame=false;FX.flash=0;FX.stop=0;render()}lastT=now;return}
 lastMode=mode;const cap=S.set.eco?1/31:(mode==='menu'?1/25:0);if(el<cap)return;lastT=now;const dt=Math.min(.05,Math.max(0,el));
 if(mode==='menu'&&!$('#start').classList.contains('hidden')){time+=dt;return} // фон стартового экрана — картинка, мир за ним не рисуем
 if(mode==='play'&&el<.25)autoQuality(el);
 if(mode==='play'&&S.slot2New&&!S.pickShown&&!S.slots[1]&&!P.dead&&!BF.active)openSlotPick(); // если отложенный показ не сработал
 FX.flash=Math.max(0,FX.flash-dt*1.5);
 if(FX.stop>0){FX.stop-=dt;render();return} // hitstop
 if(mode==='play')update(dt);else{time+=dt;updParticles(dt);cam.x=P.x+Math.cos(time*.2)*24;cam.y=P.y+Math.sin(time*.27)*14;P.anim=0;P.face+=dt*.4;for(const e of enemies){e.x+=Math.cos(time*.7+e.seed)*14*dt;e.y+=Math.sin(time*.9+e.seed*1.3)*14*dt}}
 render()}
resize();P.hp=ST.hp;if(S.ch>S.maxCh)S.ch=S.maxCh;
$('#bPlay').textContent=S.started?'Продолжить · ур. '+S.lvl:'Играть';startInfo();
// демо-враги на фоне меню
spawnDemo();
requestAnimationFrame(frame);
