<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--acc:#ffb347;--pink:#ff5d8f;--panel:#1d1838;--panel2:#2a2350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#0d0b1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2 0 18%,#ffd34d 30%,#e09a00 100%);box-shadow:0 0 0 1.5px #8a5a00 inset;vertical-align:-.12em;margin-right:.25em}
.spark{display:inline-block;width:.9em;height:.9em;background:radial-gradient(circle,#fff 0 15%,#ffcf6b 30%,#ff6a3d 70%,transparent 72%);vertical-align:-.1em;margin-right:.2em;border-radius:50%}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 12px) calc(var(--sal) + 10px)}
#top{display:flex;align-items:center;gap:8px;margin-right:64px}
#lvl{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd28a,#ff7b39 70%,#b8430f);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;text-shadow:0 1px 2px #0008;box-shadow:0 2px 6px #0007,0 0 0 2px #fff3 inset;flex:none}
.bars{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.bar{position:relative;height:14px;border-radius:8px;background:#0009;overflow:hidden;box-shadow:0 0 0 1.5px #0006}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px}
.bar.hp i{background:linear-gradient(#7dff8f,#24b94a)}
.bar.hp.low i{background:linear-gradient(#ff8f8f,#d62b2b)}
.bar.xp{height:9px}.bar.xp i{background:linear-gradient(#9fd8ff,#3c8dff)}
.bar span{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;font-weight:800;text-shadow:0 1px 1px #000}
#res,#zone,#quest,#daily{margin-right:110px}
#res{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;font-size:13px;font-weight:800}
.chip{background:#000a;border-radius:12px;padding:4px 7px;box-shadow:0 0 0 1px #fff2 inset;white-space:nowrap}
.chip.full{background:#b3122eee;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#zone{margin-top:6px;font-size:12px;font-weight:700;opacity:.92;text-shadow:0 1px 2px #000}
#quest{margin-top:6px;background:linear-gradient(90deg,#000b,#0006);border-left:3px solid var(--acc);border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.3}
#quest b{color:var(--acc)}
#quest .qb{height:4px;background:#fff2;border-radius:3px;margin-top:4px;overflow:hidden}
#quest .qb i{display:block;height:100%;background:var(--acc)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 200px);background:#000c;padding:8px 14px;border-radius:14px;font-size:14px;font-weight:700;max-width:86%;text-align:center;box-shadow:0 0 0 1.5px #ffb34788;transition:opacity .3s}
.hbtn{pointer-events:auto;touch-action:none;-webkit-user-select:none;position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;box-shadow:0 4px 10px #0008,0 0 0 2px #fff3 inset;text-shadow:0 1px 2px #0009;overflow:hidden}
.hbtn:active{transform:scale(.93)}
.hbtn .cd{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}
.hbtn small{font-size:10px;opacity:.9;position:relative}
.hbtn span{position:relative}
#bPause{top:calc(var(--sat) + 8px);right:calc(var(--sar) + 10px);width:42px;height:42px;background:#0009;font-size:15px;letter-spacing:1px}
#bDash{right:calc(var(--sar) + 16px);bottom:calc(var(--sab) + 22px);width:84px;height:84px;background:radial-gradient(circle at 35% 30%,#ff9ab8,#e2336b 70%);font-size:14px}
#bHome{right:calc(var(--sar) + 27px);bottom:calc(var(--sab) + 124px);width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#a5f3ff,#2a8fc4 70%);font-size:12px}
#bHome.back{background:radial-gradient(circle at 35% 30%,#c8ffb0,#3fae3a 70%)}
#bBoss{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 124px);padding:12px 22px;border-radius:30px;background:linear-gradient(#ff7b8c,#d6264a);font-weight:900;font-size:15px;box-shadow:0 4px 0 #7d1028,0 0 10px #ff4d6d66;animation:bossp .8s infinite alternate}
@keyframes bossp{to{box-shadow:0 4px 0 #7d1028,0 0 26px #ff4d6dcc}}
#bUp.new::before{content:"2";position:absolute;top:4px;left:8px;min-width:18px;height:18px;border-radius:9px;background:#7cf3ff;color:#04263a;font-size:11px;line-height:18px}
.tabs button.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff2e55;margin-left:4px;vertical-align:2px}
.row.glow{box-shadow:0 0 0 2px #7cf3ff inset;animation:glowp .8s infinite alternate}
@keyframes glowp{to{box-shadow:0 0 0 2px #7cf3ff inset,0 0 16px #7cf3ff99}}
#daily{margin-top:5px;font-size:11px;background:#0008;border-radius:8px;padding:4px 8px;border-left:3px solid #7cf3ff}
.buffc{background:#3a2a7acc;color:#e4d4ff}
#bUp{left:calc(var(--sal) + 14px);bottom:calc(var(--sab) + 18px);width:78px;height:78px;background:radial-gradient(circle at 35% 30%,#ffe29a,#f08c00 70%);font-size:12px}
#bUp.can::after{content:"";position:absolute;top:7px;right:12px;width:12px;height:12px;border-radius:50%;background:#ff2e55;box-shadow:0 0 0 2px #fff}

#bAuto.on{background:radial-gradient(circle at 35% 30%,#d6b3ff,#7b3fe4 70%)}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);background:#070512cc;z-index:10}
.panel{width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#262048,#1a1534);border-radius:22px;box-shadow:0 10px 40px #000a,0 0 0 2px #ffffff14 inset;padding:16px;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:8px}
.phead .sp{flex:1}
.x{width:38px;height:38px;border-radius:12px;background:#ffffff14;font-size:22px;line-height:1}
.tabs{display:flex;gap:6px;margin:6px 0}

.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;flex:1;min-height:0;padding-right:2px}
.row{display:flex;align-items:center;gap:10px;background:#ffffff0c;border-radius:14px;padding:10px;margin-bottom:8px}
.row .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px}
.row .tx small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.row .tx .gr{color:#8dff9c;font-weight:700;opacity:1}
.buy{min-width:84px;padding:9px 8px;border-radius:12px;background:linear-gradient(#ffd166,#f39c12);color:#2a1600;font-weight:900;font-size:13px;box-shadow:0 3px 0 #a35f00}
.buy:disabled{background:#4a4470;color:#fff8;box-shadow:0 3px 0 #2c2850}
.buy.alt{background:linear-gradient(#a5f3ff,#2a8fc4);color:#04263a;box-shadow:0 3px 0 #145a80}
.buy.ok{background:#2f7a43;color:#d8ffe0;box-shadow:0 3px 0 #1b4a28}
.amt{display:flex;gap:6px;align-items:center;font-size:12px;margin:2px 0 8px}
.amt button{padding:5px 10px;border-radius:9px;background:#ffffff12;font-weight:800}
.amt button.on{background:#fff;color:#222}
.big{display:block;width:100%;padding:15px;border-radius:16px;font-size:18px;font-weight:900;background:linear-gradient(#ffd166,#f08c00);color:#2a1600;box-shadow:0 5px 0 #9a5500;margin-top:10px}
.big.sec{background:#ffffff14;color:#fff;box-shadow:0 5px 0 #0006}
.big.red{background:linear-gradient(#ff7b8c,#d6264a);color:#fff;box-shadow:0 5px 0 #7d1028}
#start{background:radial-gradient(ellipse at 50% 30%,#2d1f5ecc,#0b0818ee 70%);flex-direction:column}
#start h1{margin:0;font-size:46px;line-height:1;font-weight:900;text-align:center;letter-spacing:1px;background:linear-gradient(#fff3c4,#ffb347 50%,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1240) drop-shadow(0 0 20px #ff7a4855)}
#start .sub{text-align:center;opacity:.85;margin:6px 0 16px;font-weight:700;letter-spacing:2px;font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.badges span{font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;background:#ffffff14;box-shadow:0 0 0 1px #ffffff22 inset}
.badges span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#6dff8b;margin-right:6px;vertical-align:1px}
#startBox{width:100%;max-width:360px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#ffffff0c;border-radius:14px;margin-bottom:7px;font-size:14px;font-weight:700}
.tog small{display:block;font-weight:500;opacity:.7;font-size:11px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:#4a4470;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#34c759}.sw.on::after{left:23px}
#toasts{position:absolute;top:34%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.toast{background:#000d;padding:8px 14px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 0 0 1.5px var(--acc);animation:tin .25s ease-out;max-width:90%;text-align:center}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}}
.stat{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #ffffff12;font-size:14px}
.stat b{color:var(--acc)}
textarea{width:100%;height:110px;border-radius:12px;background:#0006;color:#fff;border:1px solid #fff3;padding:8px;font-size:11px;-webkit-user-select:text;user-select:text;touch-action:auto}
p{line-height:1.45;font-size:14px;margin:6px 0}
.res-title{font-size:30px;font-weight:900;text-align:center;margin:4px 0 8px}
.win{color:#ffd166}.lose{color:#ff7b8c}
</style>
</head>

<div id="upScreen" class="screen hidden">
  <div class="panel">
    <div class="phead"><b>Прокачка</b><span class="sp"></span><span class="chip"><span class="coin"></span><b id="upBank">0</b></span><span class="chip"><span class="spark"></span><b id="upSparks">0</b></span><button class="x" id="upClose">×</button></div>
    <div id="powLine" style="font-size:12px;opacity:.85;margin-bottom:4px"></div>
    <div class="tabs" id="tabs"><button data-tab="up" class="on">Навыки</button><button data-tab="wp">Оружие</button><button data-tab="tal">Таланты</button><button data-tab="ch">Главы</button></div>
    <div class="amt" id="amt">Покупать: <button data-n="1" class="on">x1</button><button data-n="10">x10</button><button data-n="max">МАКС</button></div>

<script>
'use strict';
/* Искра Героя — оригинальная игра. Вся графика и звук генерируются кодом. */
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
let W=390,H=844,DPR=1,ZOOM=1,SAFE={t:0,b:0,l:0,r:0};
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy};
const norm=(x,y)=>{const d=Math.hypot(x,y);return d<1e-6?{x:0,y:0}:{x:x/d,y:y/d}};
function fmt(n){n=Math.floor(n);if(n<10000)return ''+n;const u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc'];let i=0,x=n;while(x>=1000&&i<u.length-1){x/=1000;i++}return(x<10?x.toFixed(2):x<100?x.toFixed(1):Math.floor(x))+u[i]}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

/* ---------- МИР ---------- */
const RING=[0,170,620,1050,1480,1900];
const BASE_R=165,WORLD_R=1900;
const ALTAR={x:0,y:-1640};const ARENA_R=360;
const BIOMES=[
 {name:'Солнечные луга',g1:'#4c8a3f',g2:'#437c37',deco:'#6fb556',dark:'#2f5a28',acc:'#ffcf5a'},
 {name:'Ржавые пустоши',g1:'#9a7646',g2:'#8b6a3e',deco:'#c09a5e',dark:'#5e4423',acc:'#ffb36b'},
 {name:'Ледяной край',g1:'#6b93b0',g2:'#5f86a3',deco:'#b8dcf0',dark:'#3b5a72',acc:'#c9f1ff'},
 {name:'Пепельные холмы',g1:'#544850',g2:'#4a3f46',deco:'#7a6370',dark:'#2c2329',acc:'#ff8a5b'},
 {name:'Грибной лес',g1:'#55437a',g2:'#4b3a6b',deco:'#8f6fc6',dark:'#2c2145',acc:'#f0a8ff'},
 {name:'Звёздная бездна',g1:'#262c4d',g2:'#20263f',deco:'#4b55a0',dark:'#11142a',acc:'#7cf3ff'}];
const biome=ch=>BIOMES[(ch-1)%BIOMES.length];
const biomeName=ch=>biome(ch).name+(ch>BIOMES.length?' '+(Math.floor((ch-1)/BIOMES.length)+1):'');
const tier=(ch,ring)=>(ch-1)*4+ring;
const enemyHP=t=>24*Math.pow(1.5,t-1);
const enemyDmg=t=>5*Math.pow(1.48,t-1);
const BAL={lootB:3,lootG:1.74,ramp:.8,rampMax:16,costG:1.2,xpB:20,xpG:1.28,lvlB:.02};
const lootVal=t=>BAL.lootB*Math.pow(BAL.lootG,t-1);
const xpVal=t=>4*Math.pow(1.5,t-1);
const xpNeed=L=>Math.floor(BAL.xpB*Math.pow(BAL.xpG,L-1));
// «Сила» = sqrt(реальный DPS × здоровье). Рекомендация — в той же шкале (стартовый герой с мечом ≈ зона 1).
const recPower=t=>Math.round(Math.sqrt(enemyHP(t)*.95*enemyDmg(t)*19));
const bossRec=ch=>Math.round(recPower(tier(ch,4))*1.3);

/* ---------- СОХРАНЕНИЕ ---------- */
const SAVE_KEY='iskra_geroya_save_v1';
function newSave(){return{v:1,bank:0,bag:{n:0,v:0},lvl:1,xp:0,
 up:{atk:0,hp:0,aspd:0,spd:0,bag:0,regen:0,crit:0,mag:0},
 tal:{might:0,vital:0,greed:0,wisdom:0,portal:0},sparks:0,
 ch:1,maxCh:1,unlocked:1,guards:{},bosses:{},bossFails:0,
 slots:['sword',null],quest:null,qn:0,
 stats:{kills:0,coins:0,bosses:0,deaths:0,play:0,elites:0,goblins:0},
 set:{music:true,sfx:true,vib:true,eco:false,nums:true,adapt:true,auto:false,autoBoss:false},buff:{gold:0,dmg:0,xp:0},daily:null,slot2New:false,
 last:Date.now(),tut:0,started:false}}
function merge(d,o){for(const k in o){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))merge(d[k],o[k]);else d[k]=o[k]}return d}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(r)return merge(newSave(),JSON.parse(r))}catch(e){}return newSave()}
let S=load();
function save(){try{S.last=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

/* ---------- ЗВУК (WebAudio, всё синтезируется) ---------- */
const AU={c:null,m:null,sfx:null,mus:null,nb:null,last:{},next:0,step:0};
function initAudio(){
 try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(e){} // не глушит музыку/подкасты на iOS 16.4+
 if(AU.c){if(AU.c.state!=='running')AU.c.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{AU.c=new AC()}catch(e){return}
 const c=AU.c;AU.m=c.createGain();AU.m.gain.value=.8;AU.m.connect(c.destination);
 AU.sfx=c.createGain();AU.sfx.gain.value=.55;AU.sfx.connect(AU.m);
 AU.mus=c.createGain();AU.mus.gain.value=.16;AU.mus.connect(AU.m);
 const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b;
 setInterval(musicTick,90);
}

function goHome(){if(P.homeCd>0||P.dead||inBase())return;if(BF.active)endBoss(false,true);burst(P.x,P.y,'#7cf3ff',24,200);P.back={x:P.x,y:P.y,ch:S.ch};P.backT=45;P.x=0;P.y=60;cam.x=P.x;cam.y=P.y;P.homeCd=ST.homeCd;sfx('tele');burst(P.x,P.y,'#7cf3ff',24,200);
 if(S.tut<3)hint('Добыча сдаётся автоматически на базе. Здесь же герой лечится.')}
const canBack=()=>!!(P.back&&P.backT>0&&inBase()&&P.back.ch===S.ch);
const nearAltar=()=>mode==='play'&&!P.dead&&accessible()>=4&&!BF.active&&BF.cool<=0&&Math.hypot(P.x-ALTAR.x,P.y-ALTAR.y)<120;
function openBossConfirm(){if(!nearAltar())return;mode='paused';sfx('warn');const pw=power(),need=bossRec(S.ch),ok=pw>=need,mid=pw>=need*.75;
 const ad=S.set.adapt&&S.ch===S.maxCh&&S.bossFails>0?'<p>Поддержка: босс ослаблен на <b>'+Math.round(Math.min(.3,.06*S.bossFails)*100)+'%</b> (адаптивная сложность).</p>':'';
 modal('<div class="res-title" style="color:#ff7b8c">'+BOSSNAMES[(S.ch-1)%BOSSNAMES.length]+'</div><div class="chip" style="display:block;text-align:center;font-size:16px;padding:10px">Твоя сила <b style="color:'+(ok?'#8dff9c':mid?'#ffd166':'#ff7b8c')+'">'+fmt(pw)+'</b> · нужна <b>'+fmt(need)+'</b></div><p>'+(ok?'Ты готов. Следи за красными зонами и жми Рывок.':mid?'Будет тяжело, но реально — уворачивайся от атак.':'Пока рано: прокачай Урон и Здоровье или подбери оружие.')+'</p>'+ad+'<p style="opacity:.7;font-size:12px">Сбежать можно в любой момент кнопкой «Домой» — без штрафа.</p><button class="big red" data-boss="go">В бой!</button><button class="big sec" data-close="play">Позже</button>')}
function goBack(){if(!P.back||P.backT<=0||P.back.ch!==S.ch)return;P.x=P.back.x;P.y=P.back.y;cam.x=P.x;cam.y=P.y;P.back=null;P.backT=0;sfx('tele');burst(P.x,P.y,'#6dff8b',24,200)}
function dash(){if(P.dashCd>0||P.dead||mode!=='play')return false;const m=moveVec();const d=(m.x||m.y)?norm(m.x,m.y):{x:Math.cos(P.face),y:Math.sin(P.face)};P.dashDir=d;P.dashT=.17;P.dashCd=2.2;P.inv=Math.max(P.inv,.32);sfx('dash');return true}

/* ---------- БОССЫ И СТРАЖИ ---------- */
function startBoss(){if(BF.active||BF.cool>0)return;BF.active=true;BF.t=0;BF.kills=0;for(const e of enemies)if(Math.hypot(e.x-ALTAR.x,e.y-ALTAR.y)<ARENA_R+200&&e.type!=='guard')e.dead=true;
 BF.boss=makeEnemy('boss',ALTAR.x,ALTAR.y-150,4,{tb:.5});sfx('warn');vib(60);cam.shake=14;
 toast(BF.boss.name+' пробуждается!',2500);if(S.bossFails>0&&S.set.adapt&&S.ch===S.maxCh)toast('Поддержка: босс ослаблен на '+Math.round(Math.min(.3,.06*S.bossFails)*100)+'%',3000)}
function endBoss(win,fled){BF.active=false;BF.cool=3;if(!win&&BF.boss){BF.boss.dead=true;if(!fled&&S.ch===S.maxCh)S.bossFails++}BF.boss=null;warns=[];eshots=[]}
function onBossKill(e){questEv("boss");const first=S.ch===S.maxCh;const reward=Math.round(lootVal(tier(S.ch,4))*ST.gold*(first?120:40));S.bank+=reward;S.stats.coins+=reward;S.stats.bosses++;
 const sp=first?3:1;S.sparks+=sp;const fightT=BF.t;const ch=S.ch;endBoss(true);S.bossFails=0;sfx('win');vib(80);cam.shake=18;
 if(first){S.maxCh++;S.unlocked=1}save();
 setTimeout(()=>showResult({win:true,ch,first,reward,sp,fightT}),1100)}
function onGuardKill(e){const key=S.ch+'-'+e.ring;if(!S.guards[key]){S.guards[key]=1;S.sparks+=1;toast('+1 искра таланта',2500)}
 if(S.ch===S.maxCh&&S.unlocked===e.ring){S.unlocked=e.ring+1;sfx('win');toast(S.unlocked<4?'Барьер пал! Открыта зона '+S.unlocked:'Открыта зона 4 — на севере ждёт алтарь босса!',3500);cam.shake=10}
 questEv('guard');save()}
function bossAI(e,dt,dx,dy,d){const ph=e.hp<e.max*.5?2:1;e.cd-=dt;
 if(e.state===1){e.st-=dt;if(e.st<=0){e.state=2;e.st=.6}return}
 if(e.state===2){e.st-=dt;e.vx=e.dir.x*620;e.vy=e.dir.y*620;if(e.st<=0){e.state=0;e.vx=e.vy=0}return}
 const n=norm(dx,dy);const sp=e.spd*(ph===2?1.25:1);if(d>170){e.vx=n.x*sp;e.vy=n.y*sp}else{e.vx=-n.y*sp*.6;e.vy=n.x*sp*.6}
 if(e.cd>0)return;e.pat=(e.pat+1)%4;e.cd=ph===2?1.7:2.4;sfx('warn');
 if(e.pat===0){warnCircle(P.x,P.y,95,1,e.dmg,1);for(let i=0;i<(ph===2?3:2);i++)warnCircle(P.x+rand(-170,170),P.y+rand(-170,170),95,1.1,e.dmg,1)}
 else if(e.pat===1){const k=ph===2?22:15,o=rand(TAU);const fire=off=>{if(e.dead)return;for(let i=0;i<k;i++){const a=o+off+i*TAU/k;eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*210,vy:Math.sin(a)*210,dmg:e.dmg*.6,life:3,r:8,boss:1})}sfx('shoot')};
  warnCircle(e.x,e.y,e.r+20,.5,0,1);timers.push({t:.5,fn:()=>fire(0)});if(ph===2)timers.push({t:.9,fn:()=>fire(TAU/k/2)})}
 else if(e.pat===2){e.state=1;e.st=.85;e.dir=n;e.vx=e.vy=0;warnLine(e.x,e.y,n.x,n.y,620*.6+e.r,e.r*1.6,.85)}
 else{for(let i=0;i<3;i++){const a=rand(TAU);makeEnemy(Math.random()<.5?'slime':'bat',e.x+Math.cos(a)*90,e.y+Math.sin(a)*90,4)}warnCircle(e.x,e.y,160,1.1,e.dmg*.8,1)}}
function guardAI(e,dt,dx,dy,d){if(!e.home)e.home={x:e.x,y:e.y};const hd=Math.hypot(e.x-e.home.x,e.y-e.home.y);if(e.aggro&&(hd>340||P.dead||inBase())&&e.state===0){e.aggro=false}if(!e.aggro){if(d<260&&hd<340&&!inBase())e.aggro=true;else{if(hd>8){const h=norm(e.home.x-e.x,e.home.y-e.y);e.vx=h.x*e.spd*1.3;e.vy=h.y*e.spd*1.3;e.hp=Math.min(e.max,e.hp+e.max*.1*dt)}else{e.vx=e.vy=0}return}}
 if(e.state===1){e.st-=dt;e.vx=e.vy=0;if(e.st<=0){e.state=2;e.st=.55}return}
 if(e.state===2){e.st-=dt;e.vx=e.dir.x*540;e.vy=e.dir.y*540;if(e.st<=0)e.state=0;return}
 const n=norm(dx,dy);e.vx=n.x*e.spd;e.vy=n.y*e.spd;e.cd-=dt;if(e.cd>0)return;e.cd=2.6;
 if(Math.random()<.5&&d<200){warnCircle(e.x,e.y,125,.95,e.dmg,0);e.vx=e.vy=0;e.state=1;e.st=.95;e.dir={x:0,y:0}}
 else{e.state=1;e.st=.75;e.dir=n;warnLine(e.x,e.y,n.x,n.y,540*.55+e.r,e.r*1.7,.75)}}

/* ---------- ОБНОВЛЕНИЕ ---------- */
function moveVec(){let x=0,y=0;if(keys.KeyA||keys.ArrowLeft)x--;if(keys.KeyD||keys.ArrowRight)x++;if(keys.KeyW||keys.ArrowUp)y--;if(keys.KeyS||keys.ArrowDown)y++;
 if(joy.id!==null){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const m=Math.min(1,l/55);x=dx/l*m;y=dy/l*m}}
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return{x,y}}
function weaponReach(){let r=999;for(const w of S.slots)if(w)r=Math.min(r,WEAP[w].range);return r}
function autoDir(){const hpF=P.hp/ST.hp,ib=inBase();
 for(const w of warns)if(w.kind==='c'&&w.dmg>0){const dx=P.x-w.x,dy=P.y-w.y;if(Math.hypot(dx,dy)<w.r+P.r+8)return norm(dx||1,dy)}
 if(BF.active&&BF.boss){const b=BF.boss,dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1;const want=weaponReach()<120?b.r+60:240;const k=clamp((d-want)/80,-1.5,1.5);return norm(-dy/d-dx/d*k,dx/d-dy/d*k)}
 if(S.set.autoBoss&&accessible()>=4&&!BF.active&&BF.cool<=0&&hpF>.9&&S.bag.n<ST.cap*.8&&power()>=bossRec(S.ch))return norm(ALTAR.x-P.x,ALTAR.y-P.y);
 if(hpF<.35||S.bag.n>=ST.cap){if(!ib){if(P.homeCd<=0){goHome();return{x:0,y:0}}return norm(-P.x,-P.y)}}
 if(ib){if(hpF<.92)return norm(-P.x,-P.y+40);if(P.back&&P.backT>0){goBack();return{x:0,y:0}}}
 if(S.bag.n<ST.cap){let b=null,bd=230*230;for(const l of loot){const dd=dist2(l,P);if(dd<bd){bd=dd;b=l}}if(b)return norm(b.x-P.x,b.y-P.y)}
 const acc=accessible();let ring=1;const pw=power();for(let r=1;r<=acc;r++)if(recPower(tier(S.ch,r))<=pw*1.05)ring=r;
 let b=null,bd=1e18;for(const e of enemies){if(e.dead||e.type==='guard'||e.type==='boss')continue;if(e.ring>ring&&e.type!=='goblin')continue;if(acc>=4&&Math.hypot(e.x-ALTAR.x,e.y-ALTAR.y)<260)continue;const dd=dist2(e,P);if(dd<bd){bd=dd;b=e}}
 const ga=enemies.find(e=>e.type==='guard'&&e.aggro);if(ga&&recPower(tier(S.ch,ga.ring))*1.6>pw&&dist2(ga,P)<300*300)return norm(P.x-ga.x,P.y-ga.y);
 if(b){const d=Math.sqrt(bd);if(d<weaponReach()*.55)return{x:0,y:0};return norm(b.x-P.x,b.y-P.y)}
 const mid=(RING[ring]+RING[ring+1])/2,a=Math.atan2(P.y,P.x)+.5;return norm(Math.cos(a)*mid-P.x,Math.sin(a)*mid-P.y)}
function update(dt){time+=dt;S.stats.play+=dt;BF.cool-=dt;if(BF.active)BF.t+=dt;
 for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f()}}
 const acc=accessible();
 // игрок
 if(!P.dead){let m=moveVec();if(S.set.auto&&!m.x&&!m.y)m=autoDir();
  P.dashCd-=dt;P.inv-=dt;P.homeCd-=dt;P.hurtT-=dt;if(P.backT>0){P.backT-=dt;if(P.backT<=0)P.back=null}
  let vx=m.x*ST.speed,vy=m.y*ST.speed;if(P.dashT>0){P.dashT-=dt;vx=P.dashDir.x*ST.speed*3.3;vy=P.dashDir.y*ST.speed*3.3;if(Math.random()<.7)parts.push({x:P.x,y:P.y,vx:0,vy:0,life:.25,max:.3,r:9,col:'#ff9ab8'})}
  P.moving=(m.x||m.y)?1:0;if(P.moving&&!P.swing)P.face=Math.atan2(m.y,m.x);P.anim+=dt*P.moving;
  P.x+=vx*dt;P.y+=vy*dt;
  let maxR=RING[acc+1]-P.r;const d=Math.hypot(P.x,P.y);if(d>maxR){P.x*=maxR/d;P.y*=maxR/d}
  if(BF.active){const ax=P.x-ALTAR.x,ay=P.y-ALTAR.y,ad=Math.hypot(ax,ay),mr=ARENA_R-P.r;if(ad>mr){P.x=ALTAR.x+ax/ad*mr;P.y=ALTAR.y+ay/ad*mr}}
  P.calmT-=dt;if(ST.regen>0&&P.calmT<=0&&P.hp<ST.hp)P.hp=Math.min(ST.hp,P.hp+ST.hp*ST.regen*dt); // реген только вне боя
  if(inBase()){P.hp=Math.min(ST.hp,P.hp+ST.hp*.35*dt);if(S.bag.n>0)deposit()}
  if(P.swing){P.swing.t-=dt;if(P.swing.t<=0)P.swing=null}
  updWeapons(dt);
  if(S.set.auto&&S.set.autoBoss&&acc>=4&&!BF.active&&BF.cool<=0&&Math.hypot(P.x-ALTAR.x,P.y-ALTAR.y)<55)startBoss() // только если игрок сам включил «АВТО бьёт боссов»
 }
 // спавн
 spawnT-=dt;if(spawnT<=0){spawnT=.22;trySpawn();ensureGuard()}
 goblinT-=dt;if(goblinT<=0&&!BF.active){goblinT=rand(70,110);for(let k=0;k<10;k++){const a=rand(TAU),dd=rand(380,520),x=P.x+Math.cos(a)*dd,y=P.y+Math.sin(a)*dd,r=ringOf(x,y);if(r>=1&&r<=acc){makeEnemy('goblin',x,y,r);toast('Появился Золотой воришка! Догони его!');sfx('gold');break}}}
 // враги
 for(const e of enemies){if(e.dead)continue;e.flash-=dt;e.ocd-=dt;e.tcd-=dt;
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  if(e.type!=='guard'&&e.type!=='boss'&&d>1150){e.dead=true;continue}
  const n={x:dx/d,y:dy/d};const pd=P.dead||inBase();
  switch(e.ai){
   case'chase':case'flutter':{if(d<430&&!pd){const w=e.ai==='flutter'?Math.sin(time*7+e.seed)*.8:0;e.vx=(n.x-n.y*w)*e.spd;e.vy=(n.y+n.x*w)*e.spd}else{e.wa+=rand(-1,1)*dt;e.vx=Math.cos(e.wa)*e.spd*.35;e.vy=Math.sin(e.wa)*e.spd*.35}break}
   case'ranged':{if(e.state===1){e.vx=e.vy=0;e.st-=dt;if(e.st<=0){e.state=0;e.cd=2.3;const a=Math.atan2(P.y-e.y,P.x-e.x);eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,dmg:e.dmg,life:2,r:6})}break}
    if(d<460&&!pd){const k=d<170?-1:d>260?1:0;e.vx=(n.x*k-n.y*.4)*e.spd;e.vy=(n.y*k+n.x*.4)*e.spd;e.cd-=dt;if(e.cd<=0&&d<380){e.state=1;e.st=.55;e.aim=Math.atan2(dy,dx)}}else{e.vx*=.9;e.vy*=.9}break}
   case'charge':{if(e.state===1){e.st-=dt;e.vx=e.vy=0;if(e.st<=0){e.state=2;e.st=.5}break}if(e.state===2){e.st-=dt;e.vx=e.dir.x*500;e.vy=e.dir.y*500;if(e.st<=0){e.state=0;e.cd=2.6}break}
    if(d<430&&!pd){e.vx=n.x*e.spd*.7;e.vy=n.y*e.spd*.7;e.cd-=dt;if(e.cd<=0&&d<270){e.state=1;e.st=.7;e.dir=n;warnLine(e.x,e.y,n.x,n.y,250+e.r,e.r*1.6,.7)}}else{e.vx*=.9;e.vy*=.9}break}
   case'bomb':{if(e.state===1){e.vx=e.vy=0;e.st-=dt;if(e.st<=0){e.dead=true;burst(e.x,e.y,'#ff9a3d',26,260,6);sfx('boom');cam.shake+=6;if(Math.hypot(P.x-e.x,P.y-e.y)<88+P.r)hurtPlayer(e.dmg)}break}
    if(d<430&&!pd){e.vx=n.x*e.spd;e.vy=n.y*e.spd;if(d<62){e.state=1;e.st=.8;warnCircle(e.x,e.y,88,.8,0)}}else{e.vx*=.9;e.vy*=.9}break}
   case'flee':{e.life-=dt;if(e.life<=0){e.dead=true;burst(e.x,e.y,'#ffd23f',16,150);toast('Воришка сбежал…');break}
    let fx=-n.x,fy=-n.y;const ed=Math.hypot(e.x,e.y);const lim=RING[acc+1]-60;if(ed>lim-40||ed<BASE_R+60){const tx=-e.y/ed,ty=e.x/ed;const s=(tx*fx+ty*fy)>=0?1:-1;fx=tx*s;fy=ty*s}
    const sp=d<330?e.spd:e.spd*.3;e.vx=fx*sp;e.vy=fy*sp;break}
   case'guard':guardAI(e,dt,dx,dy,d);break;
   case'boss':bossAI(e,dt,dx,dy,d);break}
  e.x+=(e.vx+e.kx)*dt;e.y+=(e.vy+e.ky)*dt;e.kx*=Math.pow(.002,dt);e.ky*=Math.pow(.002,dt);
  const ed=Math.hypot(e.x,e.y);if(ed<BASE_R+e.r){const k=(BASE_R+e.r)/(ed||1);e.x*=k;e.y*=k}
  const lim=RING[acc+1]-e.r;if(ed>lim&&e.type!=='boss'){const k=lim/ed;e.x*=k;e.y*=k}
  if(e.type==='boss'){const ax=e.x-ALTAR.x,ay=e.y-ALTAR.y,ad=Math.hypot(ax,ay),mr=ARENA_R-e.r;if(ad>mr){e.x=ALTAR.x+ax/ad*mr;e.y=ALTAR.y+ay/ad*mr;if(e.state===2){e.state=0}}}
  if(e.dmg>0&&!P.dead&&e.tcd<=0&&d<e.r+P.r){const mul=(e.state===2)?1.3:1;hurtPlayer(e.dmg*mul,e.type==='boss');e.tcd=.8;if(e.elite==='vamp')e.hp=Math.min(e.max,e.hp+e.max*.1)}}
 // разведение врагов
 for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r;if(Math.abs(dx)>rr||Math.abs(dy)>rr)continue;const d=Math.hypot(dx,dy)||1;if(d<rr){const p=(rr-d)/2/d;const wa=a.type==='boss'||a.type==='guard'?0:1,wb=b.type==='boss'||b.type==='guard'?0:1;a.x-=dx*p*wa*(wb?1:2);a.y-=dy*p*wa*(wb?1:2);b.x+=dx*p*wb*(wa?1:2);b.y+=dy*p*wb*(wa?1:2)}}}
 compact(enemies,aliveE);
 // снаряды
 for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const e of enemies){if(e.dead)continue;if(dist2(s,e)<(e.r+5)**2){hitEnemy(e,s.dmg,s.x-s.vx*.01,s.y-s.vy*.01);s.life=0;break}}}
 compact(shots,aliveL);
 for(const s of eshots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(Math.hypot(s.x,s.y)<BASE_R)s.life=0;else if(!P.dead&&dist2(s,P)<(s.r+P.r)**2){hurtPlayer(s.dmg,s.boss);s.life=0}}
 compact(eshots,aliveL);
 // предупреждения
 for(const w of warns){w.t+=dt;if(w.t>=w.T&&w.kind==='c'&&w.dmg>0){burst(w.x,w.y,'#ff6b4a',14,200,5);sfx('boom');if(!P.dead&&Math.hypot(P.x-w.x,P.y-w.y)<w.r+P.r*.5)hurtPlayer(w.dmg,w.boss)}}
 compact(warns,aliveW);
 // добыча
 const full=S.bag.n>=ST.cap;
 for(const l of loot){l.life-=dt;l.x+=l.vx*dt;l.y+=l.vy*dt;l.vx*=Math.pow(.02,dt);l.vy*=Math.pow(.02,dt);
  if(!full&&!P.dead){const dx=P.x-l.x,dy=P.y-l.y,d=Math.hypot(dx,dy);if(d<ST.magnet){const s=500*(1-d/ST.magnet)+200;l.vx=dx/d*s;l.vy=dy/d*s}if(d<P.r+10&&S.bag.n<ST.cap){S.bag.n++;S.bag.v+=l.v;l.life=0;sfx('coin');parts.push({x:l.x,y:l.y,vx:0,vy:-40,life:.3,max:.3,r:5,col:'#fff3b0'})}}}
 compact(loot,aliveL);
 if(full&&S.tut<3&&S.tut>=1){S.tut=2;hint('Рюкзак полон! Беги на базу в центр или нажми «Домой».')}
 updParticles(dt);
 // камера
 cam.x+=(P.x-cam.x)*Math.min(1,dt*8);cam.y+=(P.y-cam.y)*Math.min(1,dt*8);cam.shake*=Math.pow(.01,dt);
 saveT-=dt;if(saveT<=0){saveT=2;save()}
 for(const k in S.buff)if(S.buff[k]>0)S.buff[k]-=dt;
 {const q=S.quest;if(q&&typeof q.left==='number'){q.left-=dt;if(q.left<=0){toast('Время вышло — вот новое задание');S.quest=null;newQuest()}}}
 dailyT-=dt;if(dailyT<=0){dailyT=10;checkDaily()}

const SETS=[['music','Музыка','Отдельно от звуков. Не глушит твои подкасты (iOS 16.4+)'],['sfx','Звуковые эффекты',''],['vib','Вибрация','Android — удары и события. iPhone (iOS 18+) — только лёгкий отклик кнопок: Safari не даёт вибрировать во время боя'],['eco','Эко-режим','30 FPS, меньше частиц — телефон не греется, батарея живёт дольше'],['nums','Цифры урона',''],['adapt','Адаптивная сложность','Каждое поражение от босса ослабляет его на 6% (до 30%)'],['auto','Автоохота','Герой сам бьёт врагов, возвращается на базу и лечится'],['autoBoss','АВТО бьёт боссов','Автоохота сама идёт к алтарю и начинает бой, когда твоя сила ≥ рекомендуемой. По умолчанию выключено']];
let pauseFrom='play';
function openSet(from){pauseFrom=from;if(mode==='play')mode='paused';$('#pause').classList.remove('hidden');$('#pauseTitle').textContent=from==='play'?'Пауза':'Настройки';renderSet()}
function closeSet(){$('#pause').classList.add('hidden');if(pauseFrom==='play'&&mode==='paused')mode='play';save()}
function renderSet(){let h='';for(const[k,n,d]of SETS)h+='<div class="tog" data-set="'+k+'"><div>'+n+(d?'<small>'+d+'</small>':'')+'</div><div class="sw '+(S.set[k]?'on':'')+'"></div></div>';
 h+='<div class="stat"><span>Время в игре</span><b>'+Math.floor(S.stats.play/3600)+' ч '+Math.floor(S.stats.play%3600/60)+' мин</b></div><div class="stat"><span>Побеждено врагов</span><b>'+fmt(S.stats.kills)+'</b></div><div class="stat"><span>Боссов повержено</span><b>'+S.stats.bosses+'</b></div><div class="stat"><span>Заработано монет</span><b>'+fmt(S.stats.coins)+'</b></div>';
 if(pauseFrom==='play')h+='<button class="big" data-act="resume">Продолжить</button>';
 h+='<button class="big sec" data-act="how">Как играть</button><button class="big sec" data-act="export">Экспорт сохранения</button><button class="big sec" data-act="import">Импорт сохранения</button>';
 if(pauseFrom==='play')h+='<button class="big sec" data-act="menu">Главное меню</button>';h+='<button class="big red" data-act="reset">Сбросить прогресс</button>';
 h+='<p style="opacity:.55;font-size:11px;text-align:center;margin-top:12px">Прогресс сохраняется на этом устройстве каждые 2 секунды и сразу после покупок, уровней и заданий.</p>';$('#setList').innerHTML=h}
$('#setList').addEventListener('click',e=>{const t=e.target.closest('[data-set]');if(t){const k=t.dataset.set;S.set[k]=!S.set[k];if(k==='eco')resize();if(k==='music'||k==='sfx')initAudio();sfx('click');renderSet();updHud();save();return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;sfx('click');
 if(a==='resume')closeSet();else if(a==='how')showHow();else if(a==='menu'){closeSet();toMenu()}
 else if(a==='export'){save();const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal('<div class="phead"><b>Экспорт</b></div><p>Скопируй этот код и сохрани — по нему можно восстановить прогресс на любом устройстве.</p><textarea id="expTa" readonly>'+code+'</textarea><button class="big" id="cpy">Скопировать</button><button class="big sec" data-close>Закрыть</button>');$('#cpy').onclick=()=>{const ta=$('#expTa');ta.select();try{navigator.clipboard.writeText(code).then(()=>toast('Скопировано'),()=>{document.execCommand('copy');toast('Скопировано')})}catch(e){document.execCommand('copy')}}}
 else if(a==='import'){modal('<div class="phead"><b>Импорт</b></div><p>Вставь код сохранения:</p><textarea id="impTa"></textarea><button class="big" id="impGo">Загрузить</button><button class="big sec" data-close>Отмена</button>');$('#impGo').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#impTa').value.trim()))));if(!o||!o.up)throw 0;S=merge(newSave(),o);recalc();P.hp=ST.hp;save();closeModal();toast('Сохранение загружено');switchChapter(S.ch);renderSet()}catch(err){toast('Код не подошёл')}}}
 else if(a==='reset'){modal('<div class="phead"><b>Сбросить прогресс?</b></div><p>Весь прогресс будет удалён без возможности восстановления (если нет экспортированного кода).</p><button class="big red" id="rsGo">Да, сбросить</button><button class="big sec" data-close>Отмена</button>');$('#rsGo').onclick=()=>{localStorage.removeItem(SAVE_KEY);S=newSave();recalc();P.hp=ST.hp;closeModal();closeSet();switchChapter(1);toMenu();toast('Прогресс сброшен')}}});
$('#pClose').onclick=closeSet;
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modalBody').addEventListener('click',e=>{if(e.target.closest('[data-boss]')){closeModal();mode='play';startBoss();return}if(e.target.closest('[data-close]')){sfx('click');closeModal();if(e.target.closest('[data-close]').dataset.close==='play'&&mode==='paused')mode='play'}});
function showHow(){modal('<div class="phead"><b>Как играть</b></div>'+
 '<p><b>Движение:</b> веди пальцем в любом месте экрана (на ПК — WASD/стрелки). Атака автоматическая.</p>'+
 '<p><b>Цикл:</b> бей монстров → монеты падают в рюкзак → сдай их на базе в центре → купи улучшения → иди в зону дальше.</p>'+
 '<p><b>«Домой»</b> мгновенно переносит на базу, а на базе та же кнопка становится <b>«Назад»</b> — обратно на место охоты (45 с). Никакой беготни туда-обратно.</p>'+
 '<p><b>Барьеры</b> между зонами охраняют Стражи. В зоне 4 — алтарь босса: подойди и нажми «Вызвать босса» — бой начнётся только по твоей команде. Красные зоны на земле — атаки, от них можно увернуться <b>Рывком</b> (Пробел).</p>'+
 '<p><b>Сила</b> показывает, готов ли ты к зоне: зелёная — да, жёлтая — будет трудно, красная — подкачайся.</p>'+
 '<p><b>АВТО</b> — автоохота. Когда тебя нет, помощники копят монеты (до 8 часов).</p>'+
 '<p style="opacity:.7">ПК: Пробел — рывок, H — домой, B — назад, F — вызвать босса у алтаря, U — прокачка, T — авто, Esc — пауза.</p><button class="big" data-close>Понятно</button>')}
function showResult(o){if(mode==='menu')return;mode='result';let h;
 if(o.win){h='<div class="res-title win">Глава '+o.ch+' пройдена!</div><div class="stat"><span>Время боя</span><b>'+Math.floor(o.fightT)+' с</b></div><div class="stat"><span>Награда</span><b><span class="coin"></span>'+fmt(o.reward)+'</b></div><div class="stat"><span>Искры талантов</span><b>+'+o.sp+'</b></div><div class="stat"><span>Всего побед над врагами</span><b>'+fmt(S.stats.kills)+'</b></div>'+
  (o.first?'<p>Открыта <b>Глава '+(o.ch+1)+': '+biomeName(o.ch+1)+'</b> — новые цвета, сильнее враги, больше добычи.</p><button class="big" data-r="next">Глава '+(o.ch+1)+' →</button>':'')+'<button class="big sec" data-r="stay">Остаться здесь</button>'}
 else{const pw=power(),rec=o.boss?bossRec(S.ch):recPower(tier(S.ch,Math.min(4,Math.max(1,ringOf(P.x,P.y)))));const tips=[];
  if(pw<rec)tips.push('Твоя сила '+fmt(pw)+' ниже рекомендуемой '+fmt(rec)+'. Купи Урон и Здоровье.');
  if(o.boss)tips.push('Красные круги и полосы — это атаки. Используй Рывок: во время рывка урон не проходит.');
  if(o.boss&&S.set.adapt)tips.push('Следующая попытка: босс будет ослаблен на '+Math.round(Math.min(.3,.06*S.bossFails)*100)+'%.');
  tips.push('Ни один удар не снимает больше 20% здоровья (босс — 28%), так что ваншотов не бывает.');
  h='<div class="res-title lose">Герой пал</div><p>Монеты в рюкзаке не теряются — они будут сданы на базе.</p>'+tips.map(t=>'<p>• '+t+'</p>').join('')+'<button class="big" data-r="respawn">Возродиться на базе</button><button class="big sec" data-r="upg">Возродиться и прокачаться</button>'}
 modal(h)}
$('#modalBody').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const r=b.dataset.r;closeModal();sfx('click');
 if(r==='next'){switchChapter(S.maxCh);mode='play';toast('Глава '+S.ch+': '+biomeName(S.ch),3000)}
 else if(r==='stay'){mode='play'}
 else{respawn();mode='play';if(r==='upg')openUp()}});
function toMenu(){mode='menu';$('#hud').classList.add('hidden');$('#start').classList.remove('hidden');$('#bPlay').textContent=S.started?'Продолжить · ур. '+S.lvl:'Играть';save()}
function startGame(){initAudio();sfx('click');$('#start').classList.add('hidden');$('#hud').classList.remove('hidden');mode='play';
 if(!S.started){S.started=true;hint('Веди пальцем по экрану, чтобы бежать. Атака — автоматическая!')}checkDaily();if(!questValid())newQuest();P.hp=Math.min(P.hp||ST.hp,ST.hp);if(P.dead)respawn();updHud();save()}
function offlineReward(){const now=Date.now(),dtm=(now-(S.last||now))/60000;if(!S.started||dtm<3)return;const mins=Math.min(480,dtm);let best=1;for(let r=1;r<=4;r++)if(recPower(tier(S.maxCh,r))<=power())best=r;
 const t=tier(S.maxCh,best);const v=Math.round(lootVal(t)*ST.gold*1.6*mins);if(v<=0)return;S.bank+=v;S.stats.coins+=v;const hh=Math.floor(mins/60),mm=Math.floor(mins%60);
 modal('<div class="res-title win">С возвращением!</div><p>Пока тебя не было <b>'+(hh?hh+' ч ':'')+mm+' мин</b>, помощники собрали:</p><div class="res-title"><span class="coin"></span>'+fmt(v)+'</div><p style="opacity:.7;font-size:12px">Никаких «смотри рекламу ×2» — всё уже зачислено.</p><button class="big" data-close>Забрать</button>');save()}

/* ---------- ВВОД ---------- */
cv.addEventListener('pointerdown',e=>{if(mode!=='play')return;if(joy.id!==null)return;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}initAudio();if(S.tut===0&&!P.dead){}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;joy.x=e.clientX;joy.y=e.clientY;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>90){joy.ox=joy.x-dx/l*90;joy.oy=joy.y-dy/l*90}});
const endJoy=e=>{if(e.pointerId===joy.id)joy.id=null};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);cv.addEventListener('lostpointercapture',endJoy);
const hb=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();fn()});
hb('#bDash',()=>{if(dash())vib(10,true)});hb('#bHome',()=>{if(canBack()){goBack();vib(12,true);updHud();return}if(P.homeCd>0){toast('Портал перезаряжается: '+Math.ceil(P.homeCd)+' с');return}if(inBase()){toast('Ты уже на базе');return}goHome();vib(12,true);updHud()});hb('#bBoss',openBossConfirm);
hb('#bUp',openUp);hb('#bAuto',()=>{S.set.auto=!S.set.auto;sfx('click');toast(S.set.auto?'Автоохота включена':'Автоохота выключена');updHud()});hb('#bPause',()=>{sfx('click');openSet('play')});
$('#bPlay').onclick=startGame;$('#bHow').onclick=()=>{initAudio();showHow()};$('#bSet0').onclick=()=>{initAudio();openSet('menu')};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(mode==='play'){if(e.code==='Space'){dash();e.preventDefault()}else if(e.code==='KeyH')goHome();else if(e.code==='KeyB')goBack();else if(e.code==='KeyF'||e.code==='Enter')openBossConfirm();else if(e.code==='KeyU')openUp();else if(e.code==='KeyT'){S.set.auto=!S.set.auto;updHud()}else if(e.code==='Escape')openSet('play')}else if(e.code==='Escape'){if(!$('#upScreen').classList.contains('hidden'))closeUp();else if(!$('#pause').classList.contains('hidden'))closeSet()}});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.id=null});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.scroll'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(AU.c)AU.c.suspend();if(mode==='play'){mode='paused';openSet('play')}}else if(AU.c&&(S.set.music||S.set.sfx))AU.c.resume()});
window.addEventListener('pagehide',save);document.addEventListener('freeze',save);window.addEventListener('beforeunload',save);window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ---------- ЦИКЛ ---------- */
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);const el=(now-lastT)/1000;
 if(mode!=='play'&&mode!=='menu'){ // пауза/магазин/итоги: рисуем один замороженный кадр и не грузим GPU
  if(needFrame||lastMode!==mode){lastMode=mode;needFrame=false;render()}lastT=now;return}
 lastMode=mode;const cap=S.set.eco?1/31:(mode==='menu'?1/25:0);if(el<cap)return;lastT=now;const dt=Math.min(.05,Math.max(0,el));
 FX.flash=Math.max(0,FX.flash-dt*1.5);
 if(FX.stop>0){FX.stop-=dt;render();return} // hitstop
 if(mode==='play')update(dt);else{time+=dt;updParticles(dt);cam.x=Math.cos(time*.08)*260;cam.y=Math.sin(time*.08)*260+40}
 render()}
resize();P.hp=ST.hp;if(S.ch>S.maxCh)S.ch=S.maxCh;
$('#bPlay').textContent=S.started?'Продолжить · ур. '+S.lvl:'Играть';
offlineReward();
// демо-враги на фоне меню
for(let i=0;i<10;i++){const a=rand(TAU),d=rand(220,560);makeEnemy(['slime','bat','archer'][i%3],Math.cos(a)*d,Math.sin(a)*d,1)}
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.__G={joy,FX,heroDps,weaponDps,WEAP,newQuest,questEv,checkDaily,openBossConfirm,get needFrame(){return needFrame},BAL,UPG,upCost,recPower,bossRec,tier,power,accessible,get S(){return S},P,BF,get enemies(){return enemies},startBoss,update,recalc,openUp,closeUp,showResult,switchChapter,get mode(){return mode},set mode(v){mode=v},render};
</script>
