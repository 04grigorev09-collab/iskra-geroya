<script>/* v26: процедурная музыка (music.js от команды музыки; WebAudio, без сэмплов) */
/*!
 * music.js — процедурная музыка «Искра Героя» (v26)
 * Чистый WebAudio: осцилляторы + огибающие + фильтры. Никаких файлов/сэмплов.
 * Шумовой буфер (1 с) и короткий импульс реверба (1,2 с) генерируются ОДИН раз в init().
 *
 * API (window.Music):
 *   Music.init(audioCtx, destNode[, {jingleDest, quality:'high'|'low'}])
 *   Music.play(trackId, {fade:1.5})   — кроссфейд; trackId см. Music.tracks (+ алиасы '1'..'6', 'krug')
 *   Music.stop([fade=0.5])
 *   Music.setIntensity(0..1)          — плавно: слои/плотность/темп (сильнее всего в 'boss')
 *   Music.setVolume(v[, 'music'|'jingle'])
 *   Music.jingle(id)                  — короткая фраза поверх фона с приглушением (ducking)
 *   Music.current, Music.tracks, Music.jingles, Music.info, Music.setQuality(q), Music.debug(), Music.dispose()
 */
(function (G) {
  'use strict';

  /* ===================== утилиты ===================== */
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  let seed = ((Date.now() * 2654435761) ^ 0x9e3779b9) >>> 0;
  function rnd() { // mulberry32 — быстрый ГПСЧ
    seed = (seed + 0x6D2B79F5) >>> 0; let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const SCALES = {
    ionian: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10],
    lydian: [0, 2, 4, 6, 7, 9, 11], mixolydian: [0, 2, 4, 5, 7, 9, 10], aeolian: [0, 2, 3, 5, 7, 8, 10],
    harmonic: [0, 2, 3, 5, 7, 8, 11]
  };
  function degSemi(sc, i) { const o = Math.floor(i / 7); return sc[i - o * 7] + 12 * o; }

  /* ===================== треки =====================
     Нотация мелодий: токен = 1/8 (bar:16 → 8 токенов в такте 4/4; bar:12 → 6 токенов в 3/4 и 6/8).
       1..7 — ступень лада, ^ — октава вверх, _ — вниз, # / b — альтерация; '-' тянуть; '.' пауза; '|' — для глаз.
     Аккорды: ступень лада (диатонический трезвучие), суффиксы: M/m/d/s — мажор/минор/умен./sus4, 7 — септима, 9 — нона.
       Несколько аккордов в такте через пробел ('4 5') — делят такт поровну.
     Паттерны (на 1/16): бас R — корень долго, r — коротко, 5 — квинта, 8 — октава, 3 — терция;
       арпеджио 0..4 — тон аккорда снизу вверх; ударные X/x/o — акцент/нормально/тихо, ? — 50% случайно.
     mix: громкость слоя при интенсивности 0 / 0.5 / 1 (линейная интерполяция).
     drums / fill / pats: массивы по «уровням» интенсивности (0: <0.33, 1: <0.66, 2: выше). */
  const TRACKS = {
    base: {
      name: 'База', desc: 'уютный вальс 3/4, фа мажор, 92 BPM: музыкальная шкатулка, электропиано «ум-па-па», контрабас, лютня',
      mode: 'ionian', bpm: 92, bar: 12, rev: .26, vol: 1.25,
      lead: { inst: 'musicbox', root: 77, vol: .26, echo: .16 },
      counter: { inst: 'pluck', vol: .11, harm: -2, oct: -12, dec: .9 },
      comp: { inst: 'ep', low: 57, vol: .07, pat: '....x...x...' },
      bass: { inst: 'upright', low: 41, vol: .36, pat: 'R...........', odd: '5...........' },

const Q26D={"npc":{"keeper":{"n":"Смотритель Ор","col":"#7cb8ff","g":"🏮","a":-2.35,"hi":["Хе-хе, фитиль у тебя сегодня ровный — значит, день будет добрым.","Маяк не спит, дитя искры. Он помнит каждый твой шаг по тропам.","Свет не спорит с тьмой. Он просто приходит — и тьма уходит сама.","Устал? Посиди у сундука. Плита тёплая, я её с утра грею.","Шесть углей, шесть земель… Когда-то я видел Маяк в полную силу. Увижу снова."],"role":"Хранитель Маяка базы; ведёт главную сюжетную линию"},"smith":{"n":"Кузнец Рада","col":"#ff8a3d","g":"🔨","a":-0.8,"hi":["Ха! Опять с зазубринами? Давай сюда, поправлю.","Сталь любит упорных. И ненавидит нытиков.","В Пепельных холмах горны гудели день и ночь. Я ещё услышу этот гул.","Улучшения не покупают — их заслуживают. Ну, и покупают тоже.","Не стой столбом, искорка! Горн сам себя не разожжёт."],"role":"Кузнечиха из Пепельных холмов; прокачка, оружие, эволюции, реликвии"},"trader":{"n":"Лиса Мирра","col":"#8dff9c","g":"🦊","a":1.57,"hi":["Тсс… Слышишь? Это звенит твой рюкзак. Прекрасный звук.","Монетка к монетке — и вот уже сундук. А там и второй, фыр!","Воришка? Нет-нет, я торговка. Разница — в улыбке.","Скидок не даю. Но подмигнуть могу. *подмигивает*","Когда-нибудь у меня будет лавка размером с Маяк. Вот увидишь!"],"role":"Странствующая торговка; монеты, сдача добычи, Золотые воришки"},"stargazer":{"n":"Звездочёт Лун","col":"#c9a6ff","g":"🔭","a":0.6,"hi":["Сегодня небо пахнет… корицей? Нет, это знак дня.","Звёзды шепчут, что ты сильнее, чем вчера. Я с ними согласен.","Пожиратель проглотил половину неба. Ничего, у меня есть запасной телескоп.","Знаки не врут. Иногда путают слова — как я.","Если долго смотреть в Бездну, Бездна начинает мигать. Красиво, правда?"],"role":"Читает «Знак дня»; ежедневные задания под модификатор дня, сюжет главы 6"},"scout":{"n":"Следопытка Тиль","col":"#5fe0c8","g":"🧭","a":null,"hi":["Тц! Опять Стражи на тропах. Докладываю: их трое, а ты один. Справимся.","Приём! Карта обновлена: враги — везде. Классика.","Я бы и сама сняла Стража. Просто… мне нужно дорисовать карту.","Кабаны — главная угроза разведки. Серьёзно, видел их лбы?","Счёт за сегодня: двадцать врагов, одна кружка чая. Чай победил."],"role":"Разведчица на тропах к Стражам; бой, зоны, охота на виды врагов"},"chronicler":{"n":"Сова Шорох","col":"#ffd166","g":"🦉","a":2.6,"hi":["Ух-ху. Свиток помнит девять Кругов… или десять. Свиток не любит считать.","Записано: сей герой заглянул к летописице. Событие!","Каждый босс — строка. Каждый Круг — глава. А ты — перо.","Пепел не конец. Пепел — это чернила для новой страницы.","Тише у алтаря. Боссы спят чутко, а я — ещё чутче. Ух-ху."],"role":"Летописица Пепельного Круга; боссы, бестиарий, перерождение"}},"story":[{"id":"st1_1","g":"keeper","t":"Искра проснулась","give":"Хе-хе, проснулся, дитя искры! Маяк зажёг тебя не зря. Пройдись по лугу, набей рюкзак и принеси добычу к сундуку — пусть фитиль почует твою силу.","turn":"Слышишь, как звякнуло? Это Маяк вздохнул чуть ярче. Хорошее начало, огонёк.","c":{"ty":"deposit_count","n":1},"r":{"k":15,"b":"c","sp":0,"cr":0},"kind":"st","ch":1},{"id":"st1_2","g":"keeper","t":"Корни под плитой","give":"Плиту базы что-то подтачивает снизу… Корни, дитя. Корнеплёт тянет их из глубины луга. Проредим его слуг за первым барьером — сорок, не меньше.","turn":"Корни отпрянули — я почуял, как камень перестал дрожать. Держи искорку, она тебе пригодится.","c":{"ty":"kill_enemies","n":40,"ch":1,"zm":2},"r":{"k":30,"b":"c","sp":1,"cr":0},"kind":"st","ch":1,"pre":"st1_1"},{"id":"st1_3","g":"scout","t":"Тропа к алтарю","give":"Тц! Ты и есть новая Искра? Тиль, разведка. Докладываю: три Стража, три барьера, за ними — алтарь. Снеси всех троих, и я отмечу тропу. Приём?","turn":"Три из трёх! Тропа чистая, алтарь на севере. Ладно, признаю — ты быстрее меня. Чуть-чуть.","c":{"ty":"reach_zone","ch":1,"zone":4},"r":{"k":30,"b":"c","sp":0,"cr":0},"kind":"st","ch":1,"pre":"st1_2"},{"id":"st1_4","g":"keeper","t":"Корнеплёт","give":"У алтаря спит Корнеплёт. Он не злой — его опутал тёмный осколок, упавший со звёзд. Освободи луг, и Маяк покажет нам следующий путь.","turn":"Из корней выкатился уголёк — звёздный. Видишь? Маяк впустил его и загорелся ровнее. Первый из шести, дитя.","c":{"ty":"kill_boss","n":1,"ch":1},"r":{"k":60,"b":"c","sp":1,"cr":0},"kind":"st","ch":1,"pre":"st1_3"},{"id":"st2_1","g":"smith","t":"Ржавые клещи","give":"Ха! Наконец-то дело. Стервятник растащил по пустошам мои клещи и молоты — теперь ими машут элитные гады. Сбей четверых светящихся, искорка!","turn":"Мои клещи! Вот, держи кристалл — нашла его в ржавчине. Сам разберёшься, что из него выковать.","c":{"ty":"kill_elites","n":4,"ch":2},"r":{"k":40,"b":"c","sp":0,"cr":1},"kind":"st","ch":2,"pre":"st1_4"},{"id":"st2_2","g":"trader","t":"Перо Стервятника","give":"Тсс… Говорят, перо Ржавого Стервятника звенит, как чистое золото. Принесёшь — поделюсь выручкой. Ну, почти поровну. Фыр!","turn":"Ох, звенит! Это не золото, это звёздный уголь… Ладно-ладно, Ору отнесу. Вот твоя доля — честная, клянусь хвостом.","c":{"ty":"kill_boss","n":1,"ch":2},"r":{"k":60,"b":"c","sp":2,"cr":0},"kind":"st","ch":2,"pre":"st2_1"},{"id":"st3_1","g":"scout","t":"Следы на снегу","give":"Приём! Мой отряд застрял в Ледяном крае — Стражи вмёрзли в тропы, и всё замело. Три Стража, три барьера. Разморозишь путь?","turn":"Ребята вышли! Замёрзшие, злые, но целые. Счёт: три Стража, ноль потерь. Записываю тебя в почётные разведчики.","c":{"ty":"kill_guard","n":3,"ch":3},"r":{"k":45,"b":"c","sp":1,"cr":0},"kind":"st","ch":3,"pre":"st2_2"},{"id":"st3_2","g":"keeper","t":"Оттепель","give":"Ледяной Йети держит в лапах третий уголь — от того и стужа. Будь осторожен у алтаря: он бьёт широко, но медленно. Свет любит терпеливых.","turn":"Тает, тает край… И Маяк уже светит до самых пустошей. Половина пути, дитя искры. Хе-хе, я и не сомневался.","c":{"ty":"kill_boss","n":1,"ch":3},"r":{"k":60,"b":"c","sp":2,"cr":0},"kind":"st","ch":3,"pre":"st3_1"},{"id":"st4_1","g":"smith","t":"Горн из пепла","give":"Пепельные холмы. Мой дом. Был. Змей выпил огонь из всех горнов… Но сталь помнит жар. Разогрей любое оружие до восьмого уровня — докажи, что твоя рука не дрогнет.","turn":"Вот это звон! Восьмёрка, без трещин. Ха! В холмах тебя бы взяли в подмастерья. Сразу.","c":{"ty":"weapon_level","lv":8},"r":{"k":40,"b":"c","sp":1,"cr":0},"kind":"st","ch":4,"pre":"st3_2"},{"id":"st4_2","g":"smith","t":"Змей в золе","give":"Пепельный Змей. Он спит в золе моего горна. Верни холмам огонь, искорка, — и я выкую тебе что угодно. Только не умирай. Ненавижу перековывать героев.","turn":"Горны загудели. Слышишь? Весь склон гудит! Держи кристалл и не реви… это у меня пепел в глазу.","c":{"ty":"kill_boss","n":1,"ch":4},"r":{"k":60,"b":"c","sp":2,"cr":1},"kind":"st","ch":4,"pre":"st4_1"},{"id":"st5_1","g":"trader","t":"Споры удачи","give":"В Грибном лесу воришки наелись дурман-спор и стали неуловимы… почти. Поймай двоих — споры с них стоят целое состояние. Делим по-лисьи!","turn":"Две полные горсти спор! Ох, как светятся… Это тебе, это мне, это снова мне. Шучу! Почти.","c":{"ty":"catch_goblin","n":2,"ch":5},"r":{"k":50,"b":"c","sp":1,"cr":0},"kind":"st","ch":5,"pre":"st4_2"},{"id":"st5_2","g":"chronicler","t":"Корона из грибницы","give":"Ух-ху. Сей герой дошёл до Грибного Короля. Свиток гласит: корона его проросла из звёздного угля. Сними её — и запишу пятую строку.","turn":"Корона пала. Записано: «И пятый уголь вернулся к Маяку». Ух-ху. Свиток доволен.","c":{"ty":"kill_boss","n":1,"ch":5},"r":{"k":60,"b":"c","sp":2,"cr":0},"kind":"st","ch":5,"pre":"st5_1"},{"id":"st5_x","g":"smith","t":"Перекованная искра","give":"Слушай. Оружие десятого уровня — это не предел, это заготовка. Двадцать искр — и я перекую его в новую форму. Решайся!","turn":"Ха! Гляди, как поёт! Возвращаю часть искр — горн сегодня добрый.","c":{"ty":"evolve_weapon","n":1},"r":{"k":30,"b":"c","sp":3,"cr":0},"kind":"st","ch":5,"pre":"st4_2","opt":1},{"id":"st6_1","g":"stargazer","t":"Погасшие звёзды","give":"Звёзды шепчут… то есть молчат. Их глотает Пожиратель, а элитные тени в Бездне носят их свет. Шесть сияющих — и небо снова мигнёт нам.","turn":"Мигнуло! Вон там, над Маяком, — видишь? Ну, почти видишь. Держи кристалл, он упал прямо в мой телескоп.","c":{"ty":"kill_elites","n":6,"ch":6},"r":{"k":50,"b":"c","sp":0,"cr":1},"kind":"st","ch":6,"pre":"st5_2"},{"id":"st6_2","g":"keeper","t":"Последний свет","give":"Пять углей горят в Маяке. Шестой — в брюхе Звёздного Пожирателя. Иди, дитя искры. Что бы ни случилось — свет уже знает твоё имя.","turn":"Шесть… Маяк горит во всю силу. А мир… мир тлеет, видишь? Не бойся. Так начинается Пепельный Круг. Поговори с Шорох.","c":{"ty":"kill_boss","n":1,"ch":6},"r":{"k":100,"b":"c","sp":4,"cr":0},"kind":"st","ch":6,"pre":"st6_1"},{"id":"st7_1","g":"chronicler","t":"Пепельный Круг","give":"Ух-ху. Мир сгорит и родится вновь. Главы забудутся, монеты истлеют — но Память останется. Шагни в Пепельный Круг, сей герой.","turn":"Записано: «Круг замкнулся — и начался». Возьми кристалл: в новом Круге реликвии нужны с первых шагов.","c":{"ty":"rebirth","n":1},"r":{"k":0,"b":"c","sp":3,"cr":1},"kind":"st","ch":6,"pre":"st6_2"},{"id":"st7_2","g":"chronicler","t":"Строка о Памяти","give":"Память — не груз, а уголь для нового огня. Вложи её в первый перк Круга — и Свиток запомнит твой выбор навсегда.","turn":"Достойный выбор. Записано. Ух-ху… Свиток видел много Кругов, но этот — твой.","c":{"ty":"buy_perk","n":1},"r":{"k":30,"b":"u","sp":2,"cr":0},"kind":"st","ch":6,"pre":"st7_1"}],"rep":[{"id":"rk_patrol","g":"keeper","t":"Ночной дозор","give":"Маяк видит тени на всех тропах, дитя. Разгони восемь десятков — пусть ночь будет тихой.","turn":"Тихо стало, хорошо. Хе-хе, Маяк даже подмигнул.","c":{"ty":"kill_enemies","n":80},"r":{"k":20,"b":"u","sp":0,"cr":0},"kind":"rep","cd":90},{"id":"rk_lights","g":"keeper","t":"Огни на тропах","give":"Страж стоит на тропе, как погасший столб. Одолей его — и столб света снова загорится.","turn":"Загорелся! Видишь луч? Это твоя работа,
